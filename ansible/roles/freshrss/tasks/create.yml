---
- name: 'Create/Update FreshRSS CNAME record'
  community.general.cloudflare_dns:
    api_token: '{{ cloudflare_dns_token }}'
    zone: '{{ domain_name }}'
    record: 'freshrss'
    ttl: 3600
    type: 'CNAME'
    value: '{{ ansible_facts["fqdn"] }}'
    proxied: false
    state: 'present'
  delegate_to: 'localhost'

- name: 'Create FreshRSS container bind mounts paths'
  ansible.builtin.file:
    path: '{{ containers_storage_path }}/{{ item }}'
    owner: 'root'
    group: 33
    mode: '0770'
    state: 'directory'
  loop:
    - 'data/freshrss/data'
    - 'data/freshrss/extensions'

- name: 'Get traefik container network info'
  containers.podman.podman_network_info:
    name: 'common-internal'
  register: 'traefik_podman_network'

- name: 'Create FreshRSS quadlet unit from template'
  ansible.builtin.template:
    src: 'freshrss.container.j2'
    dest: '/etc/containers/systemd/freshrss.container'
    owner: 'root'
    group: 'root'
    mode: '0644'
  register: 'quadlet_unit'
  notify: 'Reload systemd daemon'

- name: 'Enable and start FreshRSS container'
  ansible.builtin.systemd_service:
    name: 'freshrss.service'
    daemon_reload: true
    enabled: true
    state: 'started'
  register: 'systemd_start'

- name: 'Restart FreshRSS service if quadlet unit has changed while service was already started'
  ansible.builtin.systemd_service:
    name: 'freshrss.service'
    daemon_reload: true
    state: 'restarted'
  when: (quadlet_unit.changed and not systemd_start.changed)
