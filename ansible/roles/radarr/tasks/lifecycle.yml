---
- name: 'Pull Radarr image'
  containers.podman.podman_image:
    name: '{{ containers_images.radarr }}:{{ containers_images_tags.radarr }}'
    pull: true
    force: true
    state: 'present'
  register: 'container_image_pull'
  tags: ['never', 'containers-pull', 'containers-update']

- name: 'Update Radarr tag in quadlet unit' # noqa: no-handler
  ansible.builtin.template:
    src: 'radarr.container.j2'
    dest: '/etc/containers/systemd/radarr.container'
    owner: 'root'
    group: 'root'
    mode: '0644'
  when: (container_image_pull.changed)
  register: 'quadlet_unit'
  tags: ['never', 'containers-update']

- name: 'Restart Radarr container'
  ansible.builtin.systemd_service:
    name: 'radarr.service'
    daemon_reload: '{{ ("true" | bool) if quadlet_unit.changed else ("false" | bool) }}'
    state: 'restarted'
  when: ("containers-restart" in ansible_run_tags or
        ("containers-update" in ansible_run_tags and container_image_pull.changed))
  tags: ['never', 'containers-restart', 'containers-update']

- name: 'Disable Radarr container'
  ansible.builtin.systemd_service:
    name: 'radarr.service'
    enabled: false
  tags: ['never', 'containers-disable']

- name: 'Stop Radarr container'
  ansible.builtin.systemd_service:
    name: 'radarr.service'
    state: 'stopped'
  tags: ['never', 'containers-stop']

- name: 'Enable Radarr container'
  ansible.builtin.systemd_service:
    name: 'radarr.service'
    enabled: true
  tags: ['never', 'containers-enable']

- name: 'Start Radarr container'
  ansible.builtin.systemd_service:
    name: 'radarr.service'
    state: 'started'
  tags: ['never', 'containers-start']
