---
- name: 'Create/Update Nextcloud CNAME record'
  community.general.cloudflare_dns:
    api_token: '{{ cloudflare_dns_token }}'
    zone: '{{ domain_name }}'
    record: 'cloud'
    ttl: 3600
    type: 'CNAME'
    value: '{{ ansible_facts["fqdn"] }}'
    proxied: false
    state: 'present'
  delegate_to: 'localhost'

- name: 'Create Nextcloud stack networks'
  containers.podman.podman_network:
    name: '{{ item }}'
    internal: true
    ipv6: '{{ containers_ipv6.enable }}'
    opt:
      isolate: true
  loop:
    - 'nextcloud-postgres-internal'
    - 'nextcloud-redis-internal'

- name: 'Add Nextcloud stack networks to firewalld trusted zone'
  block:
    - name: 'Get podman networks info'
      containers.podman.podman_network_info:
        name: '{{ item }}'
      loop:
        - 'nextcloud-postgres-internal'
        - 'nextcloud-redis-internal'
      register: 'podman_networks'

    - name: 'Add podman networks subnets to firewalld trusted zone'
      ansible.posix.firewalld:
        source: '{{ item }}'
        zone: 'trusted'
        permanent: true
        immediate: true
        state: 'enabled'
      loop: '{{ podman_networks.results | community.general.json_query("[*].networks[*].subnets[*].subnet") | ansible.builtin.flatten }}'

- name: 'Get traefik container network info'
  containers.podman.podman_network_info:
    name: 'common-internal'
  register: 'traefik_podman_network'

- name: 'Create Nextcloud stack bind mounts paths'
  ansible.builtin.file:
    path: '{{ containers_storage_path }}/{{ item.path }}'
    owner: '{{ item.owner }}'
    group: '{{ item.group }}'
    mode: '{{ item.mode }}'
    state: 'directory'
  loop:
    - path: 'config/nextcloud-redis'
      owner: 999
      group: 999
      mode: '0700'
    - path: 'config/nextcloud-nginx'
      owner: 'root'
      group: 'root'
      mode: '0700'
    - path: 'runtime/nextcloud-postgres'
      owner: 999
      group: 999
      mode: '0700'
    - path: 'runtime/nextcloud-redis'
      owner: 999
      group: 999
      mode: '0700'
    - path: 'data/nextcloud-postgres'
      owner: 'root'
      group: 'root'
      mode: '0700'
    - path: 'data/nextcloud-server'
      owner: 33
      group: 33
      mode: '0755'

- name: 'Create Nextcloud documents storage path'
  ansible.builtin.file:
    path: '{{ storage_server_shares_mounts_path }}/nextcloud'
    owner: 33
    group: 33
    mode: '0750'
    state: 'directory'

- name: 'Create Nextcloud stack secrets'
  containers.podman.podman_secret:
    name: '{{ item.name }}'
    data: '{{ item.data }}'
    skip_existing: true
    state: 'present'
  loop:
    - name: 'nextcloud_postgres_user'
      data: '{{ nextcloud.postgres.user }}'
      services:
        - 'nextcloud-postgres.service'
        - 'nextcloud-server.service'
    - name: 'nextcloud_postgres_password'
      data: '{{ nextcloud.postgres.password }}'
      services:
        - 'nextcloud-postgres.service'
        - 'nextcloud-server.service'
    - name: 'nextcloud_redis_password'
      data: '{{ nextcloud.redis.password }}'
      services:
        - 'nextcloud-redis.service'
        - 'nextcloud-server.service'
  loop_control:
    label: '{{ item.name }}'
  register: 'podman_secrets'

- name: 'Create Nextcloud stack configuration files from templates'
  ansible.builtin.template:
    src: '{{ item.src }}'
    dest: '{{ containers_storage_path }}/config/{{ item.dest }}'
    owner: '{{ item.owner }}'
    group: '{{ item.group }}'
    mode: '{{ item.mode }}'
  loop:
    - src: 'redis.conf.j2'
      dest: 'nextcloud-redis/redis.conf'
      owner: 999
      group: 999
      mode: '0400'
      services: 'nextcloud-redis.service'
    - src: 'nginx.conf.j2'
      dest: 'nextcloud-nginx/nginx.conf'
      owner: 'root'
      group: 'root'
      mode: '0644'
      services: 'nextcloud-nginx.service'
  loop_control:
    label: '{{ item.dest }}'
  register: 'configuration_files'

- name: 'Create Nextcloud stack quadlet units from templates'
  ansible.builtin.template:
    src: '{{ item }}.container.j2'
    dest: '/etc/containers/systemd/{{ item }}.container'
    owner: 'root'
    group: 'root'
    mode: '0644'
  loop:
    - 'nextcloud-postgres'
    - 'nextcloud-redis'
    - 'nextcloud-server'
    - 'nextcloud-nginx'
  register: 'quadlet_units'
  notify: 'Reload systemd daemon'

- name: 'Create Nextcloud tasks systemd services from templates'
  ansible.builtin.template:
    src: '{{ item }}.service.j2'
    dest: '/etc/systemd/system/{{ item }}.service'
    owner: 'root'
    group: 'root'
    mode: '0644'
  loop:
    - 'nextcloud-cron'
    - 'nextcloud-postgres-dump'
  notify: 'Reload systemd daemon'

- name: 'Copy Nextcloud tasks systemd timers'
  ansible.builtin.copy:
    src: '{{ item }}.timer'
    dest: '/etc/systemd/system/{{ item }}.timer'
    owner: 'root'
    group: 'root'
    mode: '0644'
  loop:
    - 'nextcloud-cron'
    - 'nextcloud-postgres-dump'
  notify: 'Reload systemd daemon'

- name: 'Enable and start Nextcloud stack'
  ansible.builtin.systemd_service:
    name: '{{ item }}'
    daemon_reload: true
    enabled: true
    state: 'started'
  register: 'systemd_start'
  loop:
    - 'nextcloud-postgres.service'
    - 'nextcloud-redis.service'
    - 'nextcloud-server.service'
    - 'nextcloud-nginx.service'
    - 'nextcloud-cron.timer'
    - 'nextcloud-postgres-dump.timer'

- name: 'Restart Nextcloud services if podman secret or quadlet unit has changed while service was already started'
  ansible.builtin.systemd_service:
    name: '{{ item }}'
    daemon_reload: true
    state: 'restarted'
  vars:
    podman_secrets_map: '{{ podman_secrets.results | selectattr("changed", "true") | map(attribute="item.services") | select("defined") | ansible.builtin.flatten }}'
    configuration_files_map: '{{ configuration_files.results | selectattr("changed", "true") | map(attribute="item.services") | select("defined") | ansible.builtin.flatten }}'
    quadlet_units_map: '{{ quadlet_units.results | selectattr("changed", "true") | map(attribute="item") | ansible.builtin.product([".service"]) | map("join") }}'
    systemd_start_map: '{{ systemd_start.results | selectattr("changed", "true") | map(attribute="name") }}'
  loop: '{{ (podman_secrets_map + configuration_files_map + quadlet_units_map) | unique | difference(systemd_start_map) }}'

# Must run after the first start: the image only populates the config directory when it's empty.
# No restart needed, Nextcloud reloads config files on each request when their mtime changes.
- name: 'Create Nextcloud additional system configuration file from template'
  ansible.builtin.template:
    src: 'user-custom.config.php.j2'
    dest: '{{ containers_storage_path }}/data/nextcloud-server/config/user-custom.config.php'
    owner: 33
    group: 33
    mode: '0640'
    setype: 'container_file_t'

# App config (stored in database), it can't be set from a config.php file like system config
- name: 'Get Nextcloud OIDC multiple user backends app config'
  ansible.builtin.command:
    cmd: 'podman container exec -u www-data nextcloud-server php /var/www/html/occ config:app:get user_oidc allow_multiple_user_backends'
  register: 'user_oidc_allow_multiple_user_backends'
  changed_when: false
  failed_when: (user_oidc_allow_multiple_user_backends.rc not in [0, 1])

- name: 'Disable Nextcloud OIDC multiple user backends to redirect to Pocket ID on login'
  ansible.builtin.command:
    cmd: 'podman container exec -u www-data nextcloud-server php /var/www/html/occ config:app:set --no-interaction --type=string --lazy --value=0 user_oidc allow_multiple_user_backends'
  changed_when: true
  when: (user_oidc_allow_multiple_user_backends.stdout != '0')
