---
- name: 'Create Maintainerr data bind mount path'
  ansible.builtin.file:
    path: '{{ containers_storage_path }}/data/maintainerr'
    owner: 1000
    group: 1000
    mode: '0700'
    state: 'directory'

- name: 'Create Maintainerr quadlet unit from template'
  ansible.builtin.template:
    src: 'maintainerr.container.j2'
    dest: '/etc/containers/systemd/maintainerr.container'
    owner: 'root'
    group: 'root'
    mode: '0644'
  register: 'quadlet_unit'
  notify: 'Reload systemd daemon'

- name: 'Enable and start Maintainerr container'
  ansible.builtin.systemd_service:
    name: 'maintainerr.service'
    daemon_reload: true
    enabled: true
    state: 'started'
  register: 'systemd_start'

- name: 'Restart Maintainerr service if quadlet unit has changed while service was already started'
  ansible.builtin.systemd_service:
    name: 'maintainerr.service'
    daemon_reload: true
    state: 'restarted'
  when: (quadlet_unit.changed and not systemd_start.changed)
