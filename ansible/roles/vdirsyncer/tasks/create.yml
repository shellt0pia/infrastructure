---
- name: 'Create vdirsyncer bind mounts paths'
  ansible.builtin.file:
    path: '{{ containers_storage_path }}/{{ item }}'
    owner: 1000
    group: 1000
    mode: '0700'
    state: 'directory'
  loop:
    - 'config/vdirsyncer'
    - 'runtime/vdirsyncer'

- name: 'Create vdirsyncer config from template'
  ansible.builtin.template:
    src: 'config.j2'
    dest: '{{ containers_storage_path }}/config/vdirsyncer/config'
    owner: 1000
    group: 1000
    mode: '0644'

- name: 'Copy vdirsyncer sync script'
  ansible.builtin.copy:
    src: 'vdirsyncer.sh'
    dest: '{{ containers_storage_path }}/config/vdirsyncer/vdirsyncer.sh'
    owner: 1000
    group: 1000
    mode: '0755'

- name: 'Create vdirsyncer secrets'
  containers.podman.podman_secret:
    name: '{{ item.name }}'
    data: '{{ item.data }}'
    skip_existing: true
    state: 'present'
  loop:
    - name: 'vdirsyncer_carddav_password'
      data: '{{ vdirsyncer.carddav.password }}'
    - name: 'vdirsyncer_caldav_password'
      data: '{{ vdirsyncer.caldav.password }}'

- name: 'Create vdirsyncer systemd service from template'
  ansible.builtin.template:
    src: 'vdirsyncer.service.j2'
    dest: '/etc/systemd/system/vdirsyncer.service'
    owner: 'root'
    group: 'root'
    mode: '0644'
  notify: 'Reload systemd daemon'

- name: 'Copy vdirsyncer systemd timer'
  ansible.builtin.copy:
    src: 'vdirsyncer.timer'
    dest: '/etc/systemd/system/vdirsyncer.timer'
    owner: 'root'
    group: 'root'
    mode: '0644'
  notify: 'Reload systemd daemon'

- name: 'Add vdirsyncer command script to /usr/local/bin'
  ansible.builtin.template:
    src: 'vdirsyncer.j2'
    dest: '/usr/local/bin/vdirsyncer'
    owner: 'root'
    group: 'root'
    mode: '0755'

- name: 'Enable and start vdirsyncer timer'
  ansible.builtin.systemd_service:
    name: 'vdirsyncer.timer'
    daemon_reload: true
    enabled: true
    state: 'started'
