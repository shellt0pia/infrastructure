---
# The Vector aggregator, see docs/observability/README.md#logs. No dependsOn on VictoriaLogs: the
# aggregator buffers on disk until it answers.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vector-aggregator
spec:
  dependsOn:
    - name: priority-classes
      namespace: kube-system
  interval: 1h
  path: ./kubernetes/apps/observability/vector-aggregator/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: observability
  wait: true
