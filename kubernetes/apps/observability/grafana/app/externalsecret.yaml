---
# The OIDC client of Grafana in the Pocket ID (item `pocket-id-grafana`: `username` is the client
# id, `credential` the secret), read by Grafana from its environment at startup (envFromSecret in
# helmrelease.yaml): Reloader restarts it when they change.
# Keep the refresh interval long: 1Password rate-limits the service account.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: grafana-oidc
    creationPolicy: Owner
  data:
    - secretKey: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
      remoteRef:
        key: pocket-id-grafana/username
    - secretKey: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
      remoteRef:
        key: pocket-id-grafana/credential
