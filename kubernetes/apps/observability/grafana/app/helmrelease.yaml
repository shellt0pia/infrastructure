---
# Grafana, apart from the stack (docs/observability/README.md#grafana): the only UI of the
# metrics and the logs, login through the Pocket ID only.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: grafana
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    fullnameOverride: grafana
    # Restarted when the OIDC client changes (envFromSecret below, `auto`), and when the data
    # sources of the stack change (by name: the sidecars read that ConfigMap through the API,
    # no pod references it). Reloader checks the named list first, then `auto`. The chart puts
    # these annotations on its other resources too, where Reloader ignores them.
    annotations:
      reloader.stakater.com/auto: "true"
      configmap.reloader.stakater.com/reload: victoria-metrics-k8s-stack-grafana-ds

    # One replica (its database is a local SQLite), on the ReadWriteOnce volume of the volsync
    # component (PVC `grafana`, ks.yaml): Recreate, a second pod could not mount it.
    deploymentStrategy:
      type: Recreate
    persistence:
      enabled: true
      existingClaim: grafana
    # Runs as root, which `restricted` refuses: the volume already belongs to 472 (fsGroup, and
    # the mover of VolSync restores it as 472).
    initChownData:
      enabled: false
    securityContext:
      runAsNonRoot: true
      runAsUser: 472
      runAsGroup: 472
      fsGroup: 472
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault
    # From the usage (docs/conventions.md#resources-and-priorities).
    priorityClassName: infrastructure
    resources:
      requests:
        cpu: 100m
        memory: 640Mi
      limits:
        memory: 1280Mi

    # Only in its namespace, and only the ConfigMaps (role.yaml).
    rbac:
      namespaced: true
      useExistingRole: grafana-sidecars

    serviceMonitor:
      enabled: true
    # The Pod of `helm test`, never run by Flux.
    testFramework:
      enabled: false

    route:
      main:
        enabled: true
        hostnames:
          - grafana.shelltopia.org
        parentRefs:
          - name: internal
            namespace: network

    # No local account from the first start (only effective on an empty database), see
    # docs/observability/README.md#grafana. As an environment variable rather than in
    # grafana.ini: the chart then creates no admin Secret, and the sidecars call no admin API.
    env:
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
    # GF_AUTH_GENERIC_OAUTH_CLIENT_ID and _SECRET (externalsecret.yaml).
    envFromSecret: grafana-oidc

    grafana.ini:
      server:
        root_url: https://grafana.shelltopia.org
      security:
        cookie_secure: true
      analytics:
        reporting_enabled: false
        check_for_updates: false
        check_for_plugin_updates: false
      auth:
        disable_login_form: true
      # The Pocket ID (endpoints from its .well-known/openid-configuration). A user needs one of
      # the two groups: role_attribute_strict refuses a user without a role.
      auth.generic_oauth:
        enabled: true
        name: Pocket ID
        auth_url: https://id.shelltopia.org/authorize
        token_url: https://id.shelltopia.org/api/oidc/token
        api_url: https://id.shelltopia.org/api/oidc/userinfo
        scopes: openid profile email groups
        use_pkce: true
        auto_login: true
        allow_sign_up: true
        login_attribute_path: preferred_username
        email_attribute_path: email
        name_attribute_path: name
        groups_attribute_path: groups
        allowed_groups: kubernetes_admins kubernetes_viewers
        role_attribute_path: >-
          contains(groups[*], 'kubernetes_admins') && 'GrafanaAdmin' ||
          contains(groups[*], 'kubernetes_viewers') && 'Viewer'
        role_attribute_strict: true
        allow_assign_grafana_admin: true
        # Off, so that an outage of the Pocket ID does not end the open sessions.
        use_refresh_token: false

    sidecar:
      # From the usage of the dashboards sidecar (docs/conventions.md#resources-and-priorities).
      # The chart has one value for every sidecar: the init container of the data sources gets
      # it too, without weight on the request of the pod (the largest init container, or the
      # sum of the containers).
      resources:
        requests:
          cpu: 30m
          memory: 112Mi
        limits:
          memory: 224Mi
      # The data sources generated by the stack (its ConfigMap `victoria-metrics-k8s-stack-grafana-ds`),
      # read once at startup (init container): Grafana only reloads them through its admin API,
      # which has no account to call it. Reloader restarts Grafana when they change (annotations
      # above).
      datasources:
        enabled: true
        label: grafana_datasource
        labelValue: "1"
        resource: configmap
        initDatasources: true
        # The init container must list then exit: the chart passes watchMethod to it as is, and
        # the default WATCH never terminates (pod stuck in Init). No long-running data source
        # sidecar is deployed with initDatasources, so LIST only affects the init container.
        watchMethod: LIST
        skipReload: true
      # The default dashboards of the stack, those of the Cilium chart and those of the
      # repository (app/dashboards): no reload either, Grafana rescans the files of the provider
      # by itself.
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        resource: configmap
        skipReload: true

    # The data source of VictoriaLogs (generated by the stack) needs its plugin, downloaded from
    # grafana.com at startup, not pinned: it follows the latest release.
    plugins:
      - victoriametrics-logs-datasource

    # Community dashboards, downloaded at each start (init container, from grafana.com and
    # GitHub) and pinned by revision. The `DS_...` inputs of some of them are replaced by the
    # data source of the stack.
    # The default of the chart is -skf: -k would skip the TLS verification of the downloads.
    defaultCurlOptions: "-sf"
    # The init container that downloads them (docs/conventions.md#resources-and-priorities).
    downloadDashboards:
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: community
            orgId: 1
            folder: Community
            type: file
            disableDeletion: true
            editable: false
            options:
              path: /var/lib/grafana/dashboards/community
    dashboards:
      community:
        # Cilium: not here, its chart ships them (kube-system/cilium, `dashboards`).
        cert-manager:
          gnetId: 20842
          revision: 3
        external-secrets:
          gnetId: 21640
          revision: 4
          datasource:
            - name: DS_METRICS
              value: VictoriaMetrics
        external-dns:
          gnetId: 15038
          revision: 3
        linstor-drbd:
          gnetId: 15917
          revision: 1
          datasource:
            - name: ds_prometheus
              value: VictoriaMetrics
        envoy-gateway:
          gnetId: 24460
          revision: 1
        envoy-proxies:
          gnetId: 24459
          revision: 3
        # The UPS (nut-exporter). Revision 3: the 4 hardcodes `"uid": "prometheus"`, with no
        # `DS_` input that the chart could replace (the data source of the stack is
        # `VictoriaMetrics`); it only adds the Power panels (`ups.realpower.nominal`). Published
        # by Diaoul: not the dashboard of the nut_exporter repository (`dashboard/`), another
        # one, without the Power panels either.
        nut:
          gnetId: 19308
          revision: 3
          datasource:
            - name: DS_PROMETHEUS
              value: VictoriaMetrics
        # The MikroTik devices (mktxp), the official dashboard of MKTXP.
        mikrotik:
          gnetId: 13679
          revision: 32
          datasource:
            - name: DS_PROMETHEUS
              value: VictoriaMetrics
        # The OPNsense firewall, its node_exporter plugin. Revision 6: the last one with a
        # `DS_PROMETHEUS` input; the 7 hardcodes `"uid": "prometheus"`, the 8 and 9 use the v2
        # schema of Grafana 12 (`apiVersion`, `kind`, `spec`), which the file provisioning does
        # not read.
        opnsense-node:
          gnetId: 19366
          revision: 6
          datasource:
            - name: DS_PROMETHEUS
              value: VictoriaMetrics
        # The OPNsense firewall, the dashboard of opnsense-exporter (its only revision).
        opnsense-exporter:
          gnetId: 21113
          revision: 1
          datasource:
            - name: DS_PROMETHEUS-K0
              value: VictoriaMetrics
        # Not on grafana.com: the dashboard of the Flux monitoring example, pinned to a commit.
        flux-control-plane:
          url: https://raw.githubusercontent.com/fluxcd/flux2-monitoring-example/7ab65dc8b90f7a6751d88f18bbb4e1bee33bf334/monitoring/configs/dashboards/control-plane.json
