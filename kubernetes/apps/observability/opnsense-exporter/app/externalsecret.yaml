---
# The API key of the user `opnsense-exporter` on fw-01 (item `fw-01-opnsense-exporter`: `username`
# is the key, `credential` the secret), read by the exporter from its environment at startup
# (envFrom in helmrelease.yaml): Reloader restarts it when they change.
# Keep the refresh interval long: 1Password rate-limits the service account.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opnsense-exporter
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: opnsense-exporter
    creationPolicy: Owner
  data:
    - secretKey: OPNSENSE_EXPORTER_OPS_API_KEY
      remoteRef:
        key: fw-01-opnsense-exporter/username
    - secretKey: OPNSENSE_EXPORTER_OPS_API_SECRET
      remoteRef:
        key: fw-01-opnsense-exporter/credential
