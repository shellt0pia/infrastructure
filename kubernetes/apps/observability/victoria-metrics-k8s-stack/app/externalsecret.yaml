---
# Secrets of the Alertmanager, mounted in its pods (`spec.secrets` of the VMAlertmanager, under
# /etc/vm/secrets/alertmanager/) and read through the `*_file` fields of its configuration:
# - the Pushover user key and the token of its own application (item `pushover-alertmanager`);
# - the ping URL of the healthchecks.io check of the dead man's switch.
# The files are read at each notification: no reload needed when they change.
# Keep the refresh interval long: 1Password rate-limits the service account.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: alertmanager
    creationPolicy: Owner
  data:
    - secretKey: pushover-user-key
      remoteRef:
        key: pushover-alertmanager/username
    - secretKey: pushover-token
      remoteRef:
        key: pushover-alertmanager/credential
    - secretKey: healthchecks-url
      remoteRef:
        key: healthchecks/kubecluster-01-alertmanager
