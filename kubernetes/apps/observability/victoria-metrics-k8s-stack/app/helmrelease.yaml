---
# The VictoriaMetrics stack, see docs/observability/README.md#the-release-of-the-stack. Deployed
# in stages (docs/observability/bootstrap.md): the operator and the Alertmanager at stage 1, the
# metrics at stage 2, the logs at stage 3, each later stage enables more of the components
# disabled below.
#
# The chart is in 0.x and its minors may break the values: read its changelog before every
# upgrade, never automerge (docs/roadmap.md#upgrades).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-k8s-stack
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: victoria-metrics-k8s-stack
  # The chart ships the VictoriaMetrics CRDs in the `crds/` directory of its operator subchart,
  # which Helm only installs once: CreateReplace also updates them on every chart upgrade.
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    victoria-metrics-operator:
      crds:
        cleanup:
          # Its hook deletes the CRDs, and every VictoriaMetrics resource with them, when the
          # release is uninstalled.
          enabled: false
      # The chart default misses the seccomp profile that `restricted` requires.
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
      # From the usage (docs/conventions.md#resources-and-priorities).
      priorityClassName: infrastructure
      resources:
        requests:
          cpu: 15m
          memory: 112Mi
        limits:
          memory: 224Mi

    # Evaluates every VMRule of the cluster (selectAllByDefault), the PrometheusRules converted by
    # the operator included. Two replicas that evaluate the same rules: the Alertmanager
    # deduplicates the alerts, VMSingle the series they write (docs/observability/README.md#alerting).
    # The chart sets the rest: the datasource (the internal VMAuth below), remoteWrite and
    # remoteRead to VMSingle (the state of the `for:` restored at restart), a notifier per
    # Alertmanager replica.
    vmalert:
      enabled: true
      spec:
        replicaCount: 2
        # The scrape interval, and the dedup interval of VMSingle.
        evaluationInterval: 30s
        podDisruptionBudget:
          minAvailable: 1
        # ScheduleAnyway: with 2 nodes, a strict constraint would leave a replica Pending while a
        # node is down. The operator fills the label selector.
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
        # Same security context as the Alertmanager, see there why it is written out in full.
        useStrictSecurity: true
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          fsGroup: 65534
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
          privileged: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        # From the usage (docs/conventions.md#resources-and-priorities). The config reloader
        # values go to its init container `config-init` too.
        priorityClassName: infrastructure
        resources:
          requests:
            cpu: 20m
            memory: 112Mi
          limits:
            memory: 224Mi
        configReloaderResources:
          requests:
            cpu: 5m
            memory: 32Mi
          limits:
            memory: 64Mi

    # The links of the alerts (their generatorURL): an Explore of their expression in Grafana,
    # from the start of the alert, on the default data source (`VictoriaMetrics`). With the
    # scheme: the chart adds http:// otherwise.
    external:
      grafana:
        host: https://grafana.shelltopia.org

    # Created by the chart as soon as vmalert and vlsingle are both enabled, as the datasource of
    # vmalert: /select/logsql/.* to VLSingle (the LogsQL rules), the rest to VMSingle. Every rule
    # goes through it: if it is down, Watchdog stops too and the dead man's switch notices.
    internal:
      vmauth:
        spec:
          replicaCount: 2
          podDisruptionBudget:
            minAvailable: 1
          # ScheduleAnyway: with 2 nodes, a strict constraint would leave a replica Pending while
          # a node is down. The operator fills the label selector.
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
          # Same security context as the Alertmanager, see there why it is written out in full.
          useStrictSecurity: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # From the usage (docs/conventions.md#resources-and-priorities). The config reloader
          # values go to its init container `config-init` too.
          priorityClassName: infrastructure
          resources:
            requests:
              cpu: 15m
              memory: 32Mi
            limits:
              memory: 64Mi
          configReloaderResources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 64Mi

    # The default rules, and the upstream rules of the applications that have them, created as
    # VMRules by the sync-job below. All enabled until the noise pass
    # (docs/observability/bootstrap.md#4-alert-rules-and-the-dead-mans-switch), except:
    defaultRules:
      rules:
        # Fire as long as the cluster cannot lose a node without overcommitting: until kube-02
        # joins (docs/roadmap.md).
        KubeCPUOvercommit:
          enabled: false
        KubeMemoryOvercommit:
          enabled: false
        # Cilium: its description calls `value` without an argument, which fails when the alert
        # is rendered (not caught by `vmalert -dryRun`, which only parses it).
        RunningOutOfCiliumClusterIdentities:
          enabled: false
      groups:
        # The CoreDNS mixin selects the job `kube-dns`: here the cluster DNS (kube-system) and
        # k8s-gateway (network), both CoreDNS. With both in one selector, CoreDNSDown fires only
        # when both are down.
        coredns:
          labelRewrites:
            job:
              match: kube-dns
              value: coredns-metrics|k8s-gateway-metrics
        coredns_forward:
          labelRewrites:
            job:
              match: kube-dns
              value: coredns-metrics|k8s-gateway-metrics
        # Cilium: not used here (the IPAM of the cloud providers, Cluster Mesh).
        Cilium IPAM:
          enabled: false
        Cilium Clustermesh:
          enabled: false
        Cilium Kvstoremesh:
          enabled: false
        # Cilium: its only rule, CiliumAgentHighDeniedRate, duplicates NetworkPolicyDroppedFlows
        # (kubernetes/apps/kube-system/cilium/app/prometheusrule.yaml), which has the namespaces.
        Cilium Drops:
          enabled: false
      sources:
        # Follows kubeEtcd.enabled, disabled below.
        etcd:
          enabled: true
        # The mixins of the applications that have one (monitoring-mixins), followed as the
        # default rules: from master, at each install and upgrade of the stack
        # (docs/observability/README.md#alerting).
        cert-manager:
          url: https://raw.githubusercontent.com/monitoring-mixins/website/master/assets/cert-manager/alerts.yaml
        coredns:
          url: https://raw.githubusercontent.com/monitoring-mixins/website/master/assets/coredns/alerts.yaml
        # The mixin of Isovalent, on the metrics of the open-source agent and operator.
        cilium:
          url: https://raw.githubusercontent.com/monitoring-mixins/website/master/assets/cilium-enterprise/alerts.yaml

    # Never enabled here: the CoreDNS chart has its own monitor, and Talos runs etcd outside any
    # pod (the VMNodeScrape of ../config instead).
    coreDns:
      enabled: false
    kubeEtcd:
      enabled: false

    # The metrics, 90 days (docs/observability/README.md#storage-and-retention). One pod on a
    # `replicated` volume: Piraeus moves it to another node with its data, the VMAgent replicas
    # buffer meanwhile.
    vmsingle:
      spec:
        retentionPeriod: 90d
        extraArgs:
          # Both VMAgent replicas scrape every target: keep one sample per series per scrape
          # interval (the scrapeInterval of the VMAgent).
          dedup.minScrapeInterval: 30s
        storage:
          storageClassName: replicated
          resources:
            requests:
              storage: 50Gi
        # Same security context as the Alertmanager, see there why it is written out in full.
        useStrictSecurity: true
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          fsGroup: 65534
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
          privileged: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        # From the usage (docs/conventions.md#resources-and-priorities). The limit as the request:
        # VictoriaMetrics sizes its caches from it.
        priorityClassName: infrastructure
        resources:
          requests:
            cpu: 290m
            memory: 1536Mi
          limits:
            memory: 1536Mi

    # The logs, 30 days (docs/observability/README.md#storage-and-retention), the size cap as a
    # safety net below the volume: the oldest days go first when it is reached. Same failover as
    # VMSingle, the Vector agent and aggregator buffer on disk meanwhile.
    vlsingle:
      enabled: true
      spec:
        retentionPeriod: 30d
        retentionMaxDiskSpaceUsageBytes: 25GiB
        storage:
          storageClassName: replicated
          resources:
            requests:
              storage: 30Gi
        # Same security context as the Alertmanager, see there why it is written out in full.
        useStrictSecurity: true
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          fsGroup: 65534
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
          privileged: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        # From the usage (docs/conventions.md#resources-and-priorities). The limit as the request:
        # VictoriaLogs sizes its caches from it.
        priorityClassName: infrastructure
        resources:
          requests:
            cpu: 25m
            memory: 1Gi
          limits:
            memory: 1Gi

    # Two replicas that both scrape every target (no shardCount): a node lost costs no sample,
    # VMSingle deduplicates (docs/observability/README.md#high-availability). It selects the
    # monitors of every namespace (selectAllByDefault), the ServiceMonitors and PodMonitors
    # converted by the operator included. Reaching the pods and the node ports: the baseline and
    # host policies in kubernetes/apps/kube-system/cilium/policies.
    vmagent:
      spec:
        replicaCount: 2
        scrapeInterval: 30s
        # On every series: the dashboards and rules that expect a `cluster` label (the
        # clusterLabel of the chart) get one.
        externalLabels:
          cluster: kubecluster-01
        podDisruptionBudget:
          minAvailable: 1
        # ScheduleAnyway: with 2 nodes, a strict constraint would leave a replica Pending while a
        # node is down. The operator fills the label selector.
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
        # Same security context as the Alertmanager, see there why it is written out in full.
        useStrictSecurity: true
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          fsGroup: 65534
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
          privileged: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        # From the usage (docs/conventions.md#resources-and-priorities). The config reloader
        # values go to its init container `config-init` too.
        priorityClassName: infrastructure
        resources:
          requests:
            cpu: 90m
            memory: 512Mi
          limits:
            memory: 1Gi
        configReloaderResources:
          requests:
            cpu: 5m
            memory: 32Mi
          limits:
            memory: 64Mi

    # The defaults of the subchart already meet `restricted`.
    kube-state-metrics:
      # The ReplicationSources of VolSync, for its rules
      # (kubernetes/apps/backups/volsync/app/prometheusrule.yaml): their creation, their last
      # sync (0 before the first one) and their pause, the dates as Unix timestamps.
      # The message of the Ready condition of the Flux objects, which flux_resource_info does
      # not carry, read back in the summary of FluxResourceNotReady
      # (kubernetes/apps/flux-system/flux-operator/app/prometheusrule.yaml): every kind of the
      # toolkit groups (`kind: "*"`), and the FluxInstance (flux_instance_info). Not the
      # FluxReport, whose message changes at each report (`Reporting finished in 123ms`), nor
      # the ResourceSets, which the rule does not read. The message changes with each revision:
      # a new series per Kustomization at each commit, the old one stale at once.
      customResourceState:
        enabled: true
        config:
          kind: CustomResourceStateMetrics
          spec:
            resources:
              - groupVersionKind:
                  group: volsync.backube
                  version: v1alpha1
                  kind: ReplicationSource
                metricNamePrefix: kube_volsync_replicationsource
                labelsFromPath:
                  namespace: [metadata, namespace]
                  name: [metadata, name]
                metrics:
                  - name: created
                    help: Unix creation timestamp.
                    each:
                      type: Gauge
                      gauge:
                        path: [metadata, creationTimestamp]
                  - name: status_last_sync_time
                    help: Unix timestamp of the last successful sync, 0 before the first one.
                    each:
                      type: Gauge
                      gauge:
                        path: [status, lastSyncTime]
                        nilIsZero: true
                  - name: spec_paused
                    help: Whether the ReplicationSource is paused.
                    each:
                      type: Gauge
                      gauge:
                        path: [spec, paused]
                        nilIsZero: true
              - groupVersionKind:
                  group: kustomize.toolkit.fluxcd.io
                  version: v1
                  kind: "*"
                metricNamePrefix: kube_flux_resource
                labelsFromPath:
                  namespace: [metadata, namespace]
                  name: [metadata, name]
                metrics:
                  - name: ready_message
                    help: The message of the Ready condition of the Flux object.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          message: [status, conditions, "[type=Ready]", message]
              - groupVersionKind:
                  group: helm.toolkit.fluxcd.io
                  version: v2
                  kind: "*"
                metricNamePrefix: kube_flux_resource
                labelsFromPath:
                  namespace: [metadata, namespace]
                  name: [metadata, name]
                metrics:
                  - name: ready_message
                    help: The message of the Ready condition of the Flux object.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          message: [status, conditions, "[type=Ready]", message]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: "*"
                metricNamePrefix: kube_flux_resource
                labelsFromPath:
                  namespace: [metadata, namespace]
                  name: [metadata, name]
                metrics:
                  - name: ready_message
                    help: The message of the Ready condition of the Flux object.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          message: [status, conditions, "[type=Ready]", message]
              - groupVersionKind:
                  group: fluxcd.controlplane.io
                  version: v1
                  kind: FluxInstance
                metricNamePrefix: kube_flux_resource
                labelsFromPath:
                  namespace: [metadata, namespace]
                  name: [metadata, name]
                metrics:
                  - name: ready_message
                    help: The message of the Ready condition of the Flux object.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          message: [status, conditions, "[type=Ready]", message]
      rbac:
        extraRules:
          - apiGroups: [volsync.backube]
            resources: [replicationsources]
            verbs: [list, watch]
          - apiGroups:
              - kustomize.toolkit.fluxcd.io
              - helm.toolkit.fluxcd.io
              - source.toolkit.fluxcd.io
            resources: ["*"]
            verbs: [list, watch]
          - apiGroups: [fluxcd.controlplane.io]
            resources: [fluxinstances]
            verbs: [list, watch]
      # From the usage (docs/conventions.md#resources-and-priorities).
      priorityClassName: infrastructure
      resources:
        requests:
          cpu: 10m
          memory: 160Mi
        limits:
          memory: 320Mi

    # hostNetwork, hostPID and the root filesystem of the node: in the privileged namespace
    # (kubernetes/apps/observability-agents). Scraped on the port 9100 of the nodes.
    prometheus-node-exporter:
      namespaceOverride: observability-agents
      # The scrape stays in `observability`: without it, it only looks for the Service there.
      vmScrape:
        spec:
          namespaceSelector:
            matchNames:
              - observability-agents
      # From the usage (docs/conventions.md#resources-and-priorities).
      priorityClassName: infrastructure
      resources:
        requests:
          cpu: 10m
          memory: 48Mi
        limits:
          memory: 96Mi

    # The API server: the scrape of the chart as it is. The kubelet (and cAdvisor): verified, its
    # serving certificate is signed by the cluster CA (the caFile of the chart) and holds the
    # InternalIP that VMAgent targets (docs/cluster/README.md#kubelet-serving-certificates).
    # Helm merges maps: the rest of the scrape of the chart is kept.
    kubelet:
      vmScrape:
        spec:
          tlsConfig:
            insecureSkipVerify: false
    # The scheduler and the controller-manager: the Service of the chart selects their static
    # pods by the label `component`, which Talos sets too. They serve /metrics on 0.0.0.0 with
    # a self-signed certificate (no --tls-cert-file on Talos): no verification.
    kubeScheduler:
      vmScrape:
        spec:
          endpoints:
            - port: http-metrics
              scheme: https
              bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              tlsConfig:
                insecureSkipVerify: true
    kubeControllerManager:
      vmScrape:
        spec:
          endpoints:
            - port: http-metrics
              scheme: https
              bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              tlsConfig:
                insecureSkipVerify: true

    # Downloads the default dashboards and rules from upstream at each install or upgrade, and
    # creates them as ConfigMaps and VMRules outside Helm and Flux. The sources
    # stay on their default branches (docs/observability/evaluations.md#sources-of-the-rules-and-dashboards).
    syncJob:
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containerSecurityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      extraVolumes:
        - name: tmp
          emptyDir: {}
      extraVolumeMounts:
        - name: tmp
          mountPath: /tmp
      # From the usage (docs/conventions.md#resources-and-priorities). A post-install and
      # post-upgrade hook: no value for its class, the default (0).
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 128Mi
    defaultDashboards:
      sources:
        # Follow kubeEtcd.enabled and coreDns.enabled, disabled above.
        etcd:
          enabled: true
        kubernetes-system-coredns:
          enabled: true

    # Grafana has its own release (../../grafana). The stack still generates the ConfigMap of
    # its data sources, read by the sidecar of Grafana (label grafana_datasource), next to
    # those of the dashboards (label grafana_dashboard).
    # The VictoriaLogs data source is only rendered when its plugin is listed here; the Grafana
    # release installs the plugin itself.
    grafana:
      enabled: false
      forceDeployDatasource: true
      plugins:
        - victoriametrics-logs-datasource

    alertmanager:
      # Slack templates, no use for Pushover.
      monzoTemplate:
        enabled: false
      spec:
        # Two replicas, one per node when possible, that gossip the silences and the
        # notifications already sent (docs/observability/README.md#high-availability).
        replicaCount: 2
        podDisruptionBudget:
          minAvailable: 1
        # ScheduleAnyway: with 2 nodes, a strict constraint would leave a replica Pending while a
        # node is down. The operator fills the label selector.
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
        # Forget a replica gone for a minute, not 6 hours: its old address is retried every 10 s,
        # flows to a deleted pod that the network policies drop. The peers are DNS names, resolved
        # again every 15 s: a replaced replica joins back on its new address
        # (docs/observability/README.md#high-availability).
        extraArgs:
          cluster.reconnect-timeout: 1m
        # The security context of `restricted`, for the pod and every container. Written out in
        # full: the chart sets a partial one (user and fsGroup only) when the spec has a volume,
        # and any securityContext replaces the defaults of useStrictSecurity in the operator.
        # 65534 (nobody): the user of the image, and the default of the operator.
        useStrictSecurity: true
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          fsGroup: 65534
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
          privileged: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        # Mounted under /etc/vm/secrets/alertmanager/ (externalsecret.yaml).
        secrets:
          - alertmanager
        # The silences, a small `local` volume per replica: the gossip copies them to the
        # other one.
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: local
              resources:
                requests:
                  storage: 1Gi
        # From the usage (docs/conventions.md#resources-and-priorities). The config reloader
        # values go to its init container `config-init` too.
        priorityClassName: infrastructure
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi
        configReloaderResources:
          requests:
            cpu: 5m
            memory: 32Mi
          limits:
            memory: 64Mi
      # docs/observability/README.md#alerting. Rendered as is into the configuration Secret (no
      # Helm templating): the `{{ }}` are templates of the Alertmanager.
      config:
        route:
          # Default receiver: an alert without a known severity still rings.
          receiver: pushover-warning
          group_by: [alertname, namespace]
          repeat_interval: 12h
          routes:
            # Dead man's switch: the Watchdog alert (always firing) pings healthchecks.io every
            # minute, which notifies by its own channel when the pings stop.
            - matchers: ['alertname="Watchdog"']
              receiver: healthchecks
              group_wait: 0s
              group_interval: 30s
              repeat_interval: 1m
            # Fires (severity `none`, general.rules) as long as any `info` alert fires, to
            # inhibit them in a setup that notifies them. Ours never does.
            - matchers: ['alertname="InfoInhibitor"']
              receiver: "null"
            - matchers: ['severity="critical"']
              receiver: pushover-critical
            # Visible in Grafana only.
            - matchers: ['severity="info"']
              receiver: "null"
        # A critical alert silences the warning of the same name (the two thresholds of a
        # rule). Beyond [alertname, namespace] (kube-prometheus), the labels that tell apart
        # the instances of an alert whose namespace is the one of its exporter (a disk, a node,
        # a PVC, a certificate, a storage pool): without them, a critical on one would hide
        # the warnings of all the others. A label missing on both sides counts as equal: each
        # one added can only narrow the inhibition. To recheck at each new source of rules
        # (docs/observability/README.md#alerting).
        inhibit_rules:
          - source_matchers: ['severity="critical"']
            target_matchers: ['severity="warning"']
            equal:
              - alertname
              - namespace
              - instance
              - mountpoint
              - persistentvolumeclaim
              - exported_namespace
              - name
              - node
              - storage_pool
        # Both Pushover receivers share the same short template: the status, the name and the
        # namespace in the title; one line per alert in the body (its summary, else its
        # description); the link to the notifications of the group in Grafana (Alerting, the
        # Alertmanager data source), from where "See source" opens the generatorURL (an Explore
        # of the expression) and "Silence" silences it. Not the generatorURL itself: often over
        # the 512 characters of Pushover. The annotation `link` of the alerts of the group, when
        # they share one, as the last line of the body (Pushover makes it clickable): the Flux UI
        # for FluxResourceNotReady (kubernetes/apps/flux-system/flux-operator/app/prometheusrule.yaml).
        # Pushover cuts the body at 1024 characters: a large group loses the link.
        receivers:
          - name: "null"
          - name: pushover-warning
            pushover_configs:
              - user_key_file: /etc/vm/secrets/alertmanager/pushover-user-key
                token_file: /etc/vm/secrets/alertmanager/pushover-token
                priority: "0"
                title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .GroupLabels.alertname }}{{ with .GroupLabels.namespace }} ({{ . }}){{ end }}'
                message: '{{ range .Alerts }}{{ if eq .Status "resolved" }}[resolved] {{ end }}{{ or .Annotations.summary .Annotations.description "(no details)" }}{{ "\n" }}{{ end }}{{ with .CommonAnnotations.link }}{{ . }}{{ end }}'
                url: 'https://grafana.shelltopia.org/alerting/groups?alertmanager=Alertmanager&queryString={{ printf "alertname=%q" .GroupLabels.alertname | urlquery }}{{ with .GroupLabels.namespace }}{{ printf ",namespace=%q" . | urlquery }}{{ end }}'
                url_title: Grafana
          - name: pushover-critical
            pushover_configs:
              - user_key_file: /etc/vm/secrets/alertmanager/pushover-user-key
                token_file: /etc/vm/secrets/alertmanager/pushover-token
                # Priority 1 (bypasses the quiet hours of Pushover, not the do-not-disturb
                # mode of the phone), 0 for the resolution.
                priority: '{{ if eq .Status "firing" }}1{{ else }}0{{ end }}'
                title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .GroupLabels.alertname }}{{ with .GroupLabels.namespace }} ({{ . }}){{ end }}'
                message: '{{ range .Alerts }}{{ if eq .Status "resolved" }}[resolved] {{ end }}{{ or .Annotations.summary .Annotations.description "(no details)" }}{{ "\n" }}{{ end }}{{ with .CommonAnnotations.link }}{{ . }}{{ end }}'
                url: 'https://grafana.shelltopia.org/alerting/groups?alertmanager=Alertmanager&queryString={{ printf "alertname=%q" .GroupLabels.alertname | urlquery }}{{ with .GroupLabels.namespace }}{{ printf ",namespace=%q" . | urlquery }}{{ end }}'
                url_title: Grafana
          - name: healthchecks
            webhook_configs:
              - url_file: /etc/vm/secrets/alertmanager/healthchecks-url
                send_resolved: false
