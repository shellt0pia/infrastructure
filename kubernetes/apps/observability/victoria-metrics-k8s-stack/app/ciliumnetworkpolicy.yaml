---
# The notification-controller (namespace flux-system) sends the Flux events to the Alertmanager
# (Provider of the flux-alerts component, kubernetes/components/flux-alerts).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: alertmanager
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vmalertmanager
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: flux-system
            app.kubernetes.io/component: notification-controller
