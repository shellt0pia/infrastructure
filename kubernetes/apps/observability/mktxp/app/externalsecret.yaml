---
# The API user of sw-01 (item `sw-01-mktxp`, a Login: `username`, `password`), templated into the
# credentials file that mktxp.conf points to (`credentials_file`, helmrelease.yaml). One key per
# device, `<device>.yaml`. `toJson`: a quoted YAML string, whatever the password contains.
# MKTXP reads the file once, at startup: Reloader restarts it when it changes (helmrelease.yaml).
# Keep the refresh interval long: 1Password rate-limits the service account.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mktxp
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: mktxp
    creationPolicy: Owner
    template:
      data:
        sw-01.yaml: |
          username: {{ .sw01username | toJson }}
          password: {{ .sw01password | toJson }}
  data:
    - secretKey: sw01username
      remoteRef:
        key: sw-01-mktxp/username
    - secretKey: sw01password
      remoteRef:
        key: sw-01-mktxp/password
