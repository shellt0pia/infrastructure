---
# nut-exporter reads the NUT server of the UPS (internal network, out of the baseline): by name,
# never by address. The DNS rule lets Cilium learn the addresses of the name from the answers of
# CoreDNS. VMAgent scrapes the exporter through the baseline.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: nut-exporter-ups-01
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: nut-exporter
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchName: ups-01-dmz.shelltopia.net
    - toFQDNs:
        - matchName: ups-01-dmz.shelltopia.net
