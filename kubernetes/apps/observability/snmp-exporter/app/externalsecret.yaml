---
# The SNMPv3 user of ap-01 (item `ap-01-snmp`, an API item: `username`, `credential`, and the
# privacy password in `privacy_key`), read by the exporter from its environment at startup
# (snmp-auths.yml): Reloader restarts it when they change.
# Keep the refresh interval long: 1Password rate-limits the service account.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: snmp-exporter
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: snmp-exporter
    creationPolicy: Owner
  data:
    - secretKey: AP_01_SNMP_USERNAME
      remoteRef:
        key: ap-01-snmp/username
    - secretKey: AP_01_SNMP_PASSWORD
      remoteRef:
        key: ap-01-snmp/credential
    - secretKey: AP_01_SNMP_PRIV_PASSWORD
      remoteRef:
        key: ap-01-snmp/privacy_key
