---
# blackbox_exporter, the HTTP checks of the services outside the cluster, see
# docs/observability/README.md#external-devices. No dependsOn: no ExternalSecret, and the CRDs of
# its ServiceMonitor and PrometheusRule are there long before it, as for nut-exporter.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: blackbox-exporter
spec:
  interval: 1h
  path: ./kubernetes/apps/observability/blackbox-exporter/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: observability
  wait: true
