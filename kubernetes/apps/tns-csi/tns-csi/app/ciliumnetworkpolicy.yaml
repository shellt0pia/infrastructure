---
# Only the pod-networked controller needs a pod policy for the TrueNAS API.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: tns-csi-controller-nas
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: tns-csi-driver
      app.kubernetes.io/component: controller
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchName: nas-01-dmz.shelltopia.net
    - toFQDNs:
        - matchName: nas-01-dmz.shelltopia.net
