---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tns-csi-truenas
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: tns-csi-truenas
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        url: wss://nas-01-dmz.shelltopia.net:443/api/current
  data:
    - secretKey: username
      remoteRef:
        key: nas-01-tns-csi/username
    - secretKey: api-key
      remoteRef:
        key: nas-01-tns-csi/credential
