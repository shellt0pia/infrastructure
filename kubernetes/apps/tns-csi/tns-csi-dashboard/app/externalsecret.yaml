---
# The OIDC client of the TNS CSI dashboard in the Pocket ID (item `pocket-id-tns-csi`: `username` is the
# client id, `credential` the secret), read by Envoy Gateway under the keys it expects
# (securitypolicy.yaml). Envoy Gateway watches the Secret: no restart needed when it changes.
# Keep the refresh interval long: 1Password rate-limits the service account.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tns-csi-dashboard-oidc
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: tns-csi-dashboard-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: pocket-id-tns-csi/username
    - secretKey: client-secret
      remoteRef:
        key: pocket-id-tns-csi/credential
