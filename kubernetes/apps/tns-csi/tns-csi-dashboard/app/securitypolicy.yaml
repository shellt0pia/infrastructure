---
# Login on the Pocket ID in front of the TNS CSI dashboard and API
# (docs/ingress/runbook.md#a-ui-without-a-login-of-its-own). The group (kubernetes_admins) is
# checked by the Pocket ID, through the allowed groups of the client.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: tns-csi-dashboard
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: tns-csi-dashboard
  oidc:
    provider:
      # The endpoints are discovered from its .well-known/openid-configuration.
      issuer: https://id.shelltopia.org
    # Secret `client-id` and `client-secret` keys (externalsecret.yaml).
    clientIDRef:
      name: tns-csi-dashboard-oidc
    clientSecret:
      name: tns-csi-dashboard-oidc
    redirectURL: https://tns-csi.shelltopia.org/oauth2/callback
    logoutPath: /logout
    scopes:
      - openid
      - profile
      - email
      - groups
    refreshToken: true
