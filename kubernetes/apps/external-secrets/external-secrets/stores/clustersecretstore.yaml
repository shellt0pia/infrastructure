---
# 1Password through its SDK and a service account: no Connect server to run, but subject to the
# rate limits: 1,000 requests a day for the whole account, about 3 per field at each refresh.
# Hence `refreshInterval: 12h` on every ExternalSecret (docs/secrets/README.md#rate-limits).
# Usage in an ExternalSecret: `remoteRef.key: <item>/<field>`.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword
spec:
  provider:
    onepasswordSDK:
      # Vault title, case-sensitive (unlike the op CLI and op:// references).
      vault: Kubernetes
      auth:
        serviceAccountSecretRef:
          name: onepassword-service-account
          namespace: external-secrets
          key: token
