---
# The Vector agent, see docs/observability/README.md#logs. No dependsOn on VictoriaLogs: the
# agent buffers on disk until it answers.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vector-agent
spec:
  interval: 1h
  path: ./kubernetes/apps/observability-agents/vector-agent/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: observability-agents
  wait: true
