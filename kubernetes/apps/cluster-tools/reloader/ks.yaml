---
# Reloader restarts the workloads that opt in when a ConfigMap or a Secret they reference
# changes (tokens rotated in 1Password and synced by External Secrets). Opt-in rule:
# docs/conventions.md, details: docs/cluster/README.md#reloader.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: reloader
spec:
  dependsOn:
    - name: priority-classes
      namespace: kube-system
  interval: 1h
  path: ./kubernetes/apps/cluster-tools/reloader/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: cluster-tools
  wait: true
