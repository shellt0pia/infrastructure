---
# The OIDC client of Headlamp in the Pocket ID (item `pocket-id-headlamp`: `username` is the client
# id, `credential` the secret), under the variables the chart reads (`config.oidc.externalSecret`,
# helmrelease.yaml). The client id is also an audience of the API server, in talos/vars.yaml
# (`oidc.headlamp_client_id`): keep both in sync. Headlamp reads them at its start only: Reloader
# restarts it when they change. Keep the refresh interval long: 1Password rate-limits the service
# account.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headlamp-oidc
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: headlamp-oidc
    creationPolicy: Owner
    template:
      data:
        OIDC_CLIENT_ID: "{{ .clientID }}"
        OIDC_CLIENT_SECRET: "{{ .clientSecret }}"
        # Required in the Secret by the chart (`-oidc-idp-issuer-url=$(OIDC_ISSUER_URL)`).
        OIDC_ISSUER_URL: https://id.shelltopia.org
  data:
    - secretKey: clientID
      remoteRef:
        key: pocket-id-headlamp/username
    - secretKey: clientSecret
      remoteRef:
        key: pocket-id-headlamp/credential
