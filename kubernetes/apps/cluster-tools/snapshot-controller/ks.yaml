---
# CSI snapshot controller and the snapshot.storage.k8s.io CRDs, shared by every CSI driver
# (LINSTOR for now). In cluster-tools, not in kube-system like the upstream deployment
# (kubernetes-csi/external-snapshotter): it needs no access to the host
# (docs/cluster/README.md#pod-security). The VolumeSnapshotClass of each driver is managed with
# the driver itself (see piraeus-datastore/piraeus-operator/cluster).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: snapshot-controller
spec:
  dependsOn:
    - name: priority-classes
      namespace: kube-system
  interval: 1h
  path: ./kubernetes/apps/cluster-tools/snapshot-controller/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: cluster-tools
  wait: true
