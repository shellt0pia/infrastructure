---
# The OIDC client of Goldilocks in the Pocket ID (item `pocket-id-goldilocks`: `username` is the
# client id, `credential` the secret), read by Envoy Gateway under the keys it expects
# (securitypolicy.yaml). Envoy Gateway watches the Secret: no restart needed when it changes.
# Keep the refresh interval long: 1Password rate-limits the service account.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: goldilocks-oidc
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: goldilocks-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: pocket-id-goldilocks/username
    - secretKey: client-secret
      remoteRef:
        key: pocket-id-goldilocks/credential
