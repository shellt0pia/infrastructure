---
# The dashboard of Goldilocks, on the internal Gateway only: it lists every workload of the
# cluster. The login is the SecurityPolicy of this route (securitypolicy.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: goldilocks
spec:
  hostnames:
    - goldilocks.shelltopia.org
  parentRefs:
    - name: internal
      namespace: network
  rules:
    - backendRefs:
        - name: goldilocks-dashboard
          port: 80
