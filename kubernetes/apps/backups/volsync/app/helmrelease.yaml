---
# VolSync controller: backs up the application volumes to restic repositories on B2, from CSI
# snapshots, and fills the new volumes from the latest backup (volume populator). The
# ReplicationSources and ReplicationDestinations come from kubernetes/components/volsync, in the
# namespaces of the applications. The mover pods (restic) run in those namespaces, with the
# security context of the application (no privileged movers). See docs/backups/README.md.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: volsync
spec:
  interval: 1h
  chart:
    spec:
      chart: volsync
      version: 0.17.0
      sourceRef:
        kind: HelmRepository
        name: backube
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # The CRDs are templates of the chart (manageCRDs, default true): Helm upgrades them.
    manageCRDs: true
    # Dual-stack like the rest of the cluster (metrics Service).
    service:
      ipFamilyPolicy: PreferDualStack
    priorityClassName: infrastructure
    # From the usage (docs/conventions.md#resources-and-priorities). The movers: in
    # kubernetes/components/volsync.
    resources:
      requests:
        cpu: 5m
        memory: 112Mi
      limits:
        # Helm merges maps: null removes the CPU limit of the chart.
        cpu: null
        memory: 224Mi
  # The chart creates a ServiceMonitor as soon as its CRD exists (no value for it), without
  # credentials. The controller serves /metrics over HTTPS (self-signed, hence the
  # insecureSkipVerify of the chart) and checks the caller with a TokenReview and a
  # SubjectAccessReview: VMAgent presents its ServiceAccount token, whose ClusterRole allows `get`
  # on /metrics (docs/observability/README.md#metrics).
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: monitoring.coreos.com
              kind: ServiceMonitor
              name: volsync
            patch: |
              - op: add
                path: /spec/endpoints/0/bearerTokenFile
                value: /var/run/secrets/kubernetes.io/serviceaccount/token
