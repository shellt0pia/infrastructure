---
# healthchecks.io ping URL of the VolSync backups (one check for all of them).
# Keep the refresh interval long: 1Password rate-limits the service account.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: volsync-monitor
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: volsync-monitor
    creationPolicy: Owner
  data:
    - secretKey: HEALTHCHECKS_URL
      remoteRef:
        key: healthchecks/kube-cluster01-volsync
