---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: volsync-monitor
---
# Read-only, the ReplicationSources of every namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: volsync-monitor
rules:
  - apiGroups: ["volsync.backube"]
    resources: ["replicationsources"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: volsync-monitor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: volsync-monitor
subjects:
  - kind: ServiceAccount
    name: volsync-monitor
    namespace: backups
