---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: backups-nfs
spec:
  interval: 1h
  path: ./kubernetes/apps/backups/nfs/volume
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: backups
  wait: true
