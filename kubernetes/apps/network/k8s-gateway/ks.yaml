---
# Needs the Gateway API CRDs, installed by the envoy-gateway release.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: k8s-gateway
spec:
  dependsOn:
    - name: envoy-gateway
      namespace: envoy-gateway-system
  interval: 1h
  path: ./kubernetes/apps/network/k8s-gateway/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: network
  wait: true
