---
# Cloudflare API token of cloudflare-ddns (Zone → Zone → Read, Zone → DNS → Edit, restricted to
# shelltopia.net), distinct from the cert-manager and external-dns ones.
# Keep the refresh interval long: 1Password rate-limits the service account.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-ddns
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: cloudflare-ddns
    creationPolicy: Owner
  data:
    - secretKey: api-token
      remoteRef:
        key: cloudflare-ddns/credential
