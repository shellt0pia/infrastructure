---
# Envoy fleet of the internal Gateway: LoadBalancer Service in the default (`internal`) LB pool.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: internal
spec:
  # IPv4 and IPv6 listeners, and a RequireDualStack Service: one address of each family.
  ipFamily: DualStack
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 2
        # From the usage (docs/conventions.md#resources-and-priorities).
        container:
          resources:
            requests:
              cpu: 10m
              memory: 80Mi
            limits:
              memory: 160Mi
        pod:
          # Not a system class: the cluster does not depend on the Gateways
          # (docs/cluster/README.md#resources-and-priorities).
          priorityClassName: infrastructure
          # One proxy per node when possible. ScheduleAnyway: with 2 nodes, a strict constraint
          # would leave a replica Pending while a node is down.
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  gateway.envoyproxy.io/owning-gateway-name: internal
                  gateway.envoyproxy.io/owning-gateway-namespace: network
        # The shutdown-manager has no field of its own (10m / 32Mi, no limit, in Envoy Gateway).
        patch:
          type: StrategicMerge
          value:
            spec:
              template:
                spec:
                  containers:
                    - name: shutdown-manager
                      resources:
                        requests:
                          cpu: 5m
                          memory: 32Mi
                        limits:
                          memory: 64Mi
      envoyPDB:
        minAvailable: 1
      envoyService:
        # Keeps the client IP in the logs of Envoy, and avoids a hop between the nodes. Cilium BGP
        # then only advertises the addresses from the nodes running a proxy.
        externalTrafficPolicy: Local
