---
# Envoy fleet of the internal Gateway: LoadBalancer Service in the default (`internal`) LB pool.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: internal
spec:
  # IPv4 and IPv6 listeners, and a RequireDualStack Service: one address of each family.
  ipFamily: DualStack
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 2
        pod:
          # One proxy per node when possible. ScheduleAnyway: with 2 nodes, a strict constraint
          # would leave a replica Pending while a node is down.
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  gateway.envoyproxy.io/owning-gateway-name: internal
                  gateway.envoyproxy.io/owning-gateway-namespace: network
      envoyPDB:
        minAvailable: 1
      envoyService:
        # Keeps the client IP (needed by the SecurityPolicy allow-list). Cilium BGP then only
        # advertises the addresses from the nodes running a proxy.
        externalTrafficPolicy: Local
