---
# Envoy fleet of the external Gateway: LoadBalancer Service in the `external` LB pool (public
# IPv6, IPv4 reached through OPNsense).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: external
spec:
  # IPv4 and IPv6 listeners, and a RequireDualStack Service: one address of each family.
  ipFamily: DualStack
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 2
        # From the usage (docs/conventions.md#resources-and-priorities).
        container:
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              memory: 96Mi
        pod:
          # Not a system class: the cluster does not depend on the Gateways
          # (docs/cluster/README.md#resources-and-priorities).
          priorityClassName: infrastructure
          # One proxy per node when possible. ScheduleAnyway: with 2 nodes, a strict constraint
          # would leave a replica Pending while a node is down.
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  gateway.envoyproxy.io/owning-gateway-name: external
                  gateway.envoyproxy.io/owning-gateway-namespace: network
        # The shutdown-manager has no field of its own (10m / 32Mi, no limit, in Envoy Gateway).
        patch:
          type: StrategicMerge
          value:
            spec:
              template:
                spec:
                  containers:
                    - name: shutdown-manager
                      resources:
                        requests:
                          cpu: 5m
                          memory: 32Mi
                        limits:
                          memory: 64Mi
      envoyPDB:
        minAvailable: 1
      envoyService:
        # Keeps the client IP of the IPv6 connections (the IPv4 ones come from HAProxy, with the
        # PROXY protocol). Cilium BGP then only advertises the addresses from the nodes running
        # a proxy.
        externalTrafficPolicy: Local
        labels:
          lbipam.shelltopia.net/pool: external
        annotations:
          # external-dns publishes the public IPv6 address of the Service as the AAAA record of the
          # entry name of the Gateway (the IPv4 one is private and excluded by external-dns, the
          # A record is the WAN address, managed by cloudflare-ddns).
          external-dns.kubernetes.io/hostname: gateway-external.kubecluster-01.shelltopia.net
