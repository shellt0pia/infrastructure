---
# Separate from the envoy-gateway release: the Gateways need the Gateway API and Envoy Gateway
# CRDs installed by the chart, and the wildcard Certificate needs the ClusterIssuers.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateways
spec:
  dependsOn:
    - name: envoy-gateway
      namespace: envoy-gateway-system
    - name: cert-manager-issuers
      namespace: cert-manager
  interval: 1h
  path: ./kubernetes/apps/network/gateways/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: network
  wait: true
