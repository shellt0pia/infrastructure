---
# Cloudflare API token of external-dns (Zone → Zone → Read, Zone → DNS → Edit, restricted to
# shelltopia.org and shelltopia.net), distinct from the cert-manager and cloudflare-ddns ones.
# Keep the refresh interval long: 1Password rate-limits the service account.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-dns-cloudflare
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: external-dns-cloudflare
    creationPolicy: Owner
  data:
    - secretKey: api-token
      remoteRef:
        key: cloudflare-external-dns/credential
