---
# The Envoy proxies of the Gateways (the controller only needs its namespace): from outside of
# the cluster (LAN, internet, HAProxy) and from the pods and nodes. Same policy for both Gateways:
# the addresses of the internal one are private, only the LAN and the VPN reach them
# (docs/ingress/README.md#overview).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: envoy-proxies
spec:
  endpointSelector:
    matchExpressions:
      - key: gateway.envoyproxy.io/owning-gateway-name
        operator: Exists
  ingress:
    - fromEntities:
        - world
        - cluster
