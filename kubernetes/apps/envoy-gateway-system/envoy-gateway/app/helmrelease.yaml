---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: envoy-gateway
  # The chart ships the Gateway API and Envoy Gateway CRDs in its `crds/` directory, which Helm
  # only installs once: CreateReplace also updates them on every chart upgrade.
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  # The Envoy proxies are configured per Gateway, with the EnvoyProxy resources of the `network`
  # namespace.
  values:
    deployment:
      priorityClassName: infrastructure
      envoyGateway:
        # From the usage (docs/conventions.md#resources-and-priorities).
        resources:
          requests:
            cpu: 5m
            memory: 112Mi
          limits:
            memory: 224Mi
    # A pre-install and pre-upgrade hook. No value for its class: the default (0).
    certgen:
      job:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
