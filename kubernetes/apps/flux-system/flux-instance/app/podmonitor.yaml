---
# Metrics of the Flux controllers (:8080, port `http-prom`), from the Flux monitoring example
# (https://fluxcd.io/flux/monitoring/metrics/, fluxcd/flux2-monitoring-example). The image
# automation controllers are not installed, they are kept so that enabling them needs no change.
# The operator itself has the ServiceMonitor of its chart.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: flux-system
spec:
  selector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - helm-controller
          - source-controller
          - kustomize-controller
          - notification-controller
          - image-automation-controller
          - image-reflector-controller
  podMetricsEndpoints:
    - port: http-prom
