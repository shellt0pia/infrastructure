---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-instance
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: flux-instance
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    instance:
      distribution:
        # Flux minor and patch updates are rolled out by the operator.
        version: 2.x
      components:
        - source-controller
        - kustomize-controller
        - helm-controller
        - notification-controller
      cluster:
        networkPolicy: true
      sync:
        kind: GitRepository
        # TODO: final repository URL and branch.
        url: https://github.com/shellt0pia/infrastructure.git
        ref: refs/heads/migrate-to-k8s
        path: kubernetes/apps
