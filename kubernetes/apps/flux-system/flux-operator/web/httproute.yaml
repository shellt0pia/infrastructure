---
# The Flux UI, on the internal Gateway only. Its own login (OIDC on the Pocket ID,
# externalsecret.yaml): no SecurityPolicy. Not the route of the chart: the bootstrap helmfile
# installs flux-operator before the Gateway API CRDs (docs/conventions.md#routes-and-names).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux
spec:
  hostnames:
    - flux.shelltopia.org
  parentRefs:
    - name: internal
      namespace: network
  rules:
    - backendRefs:
        - name: flux-operator
          port: 9080
