---
# The Web Config of the Flux UI (`web.configSecretName`, ../app/helmrelease.yaml), with the OIDC
# client of the Pocket ID (item `pocket-id-flux`: `username` is the client id, `credential` the
# secret; a confidential client, flux-operator requires both). The operator watches the Secret and
# applies a change without a restart. Details: docs/cluster/README.md#flux-web-ui.
#
# The UI impersonates the user with the identities of the API server (`oidc:` prefix, as the
# KubeAuthenticationConfig of talos/patches/authentication.yaml.j2): the bindings of the groups
# (kubernetes/apps/kube-system/oidc) give the rights. `Impersonated`: an action needs its own verb
# and the native one, only `kubernetes_admins` has them.
# Keep the refresh interval long: 1Password rate-limits the service account.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-operator-web-config
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: flux-operator-web-config
    creationPolicy: Owner
    template:
      data:
        config.yaml: |
          apiVersion: web.fluxcd.controlplane.io/v1
          kind: Config
          spec:
            baseURL: https://flux.shelltopia.org
            userActions:
              access: Impersonated
            authentication:
              type: OAuth2
              oauth2:
                provider: OIDC
                clientID: {{ .clientID | toJson }}
                clientSecret: {{ .clientSecret | toJson }}
                issuerURL: https://id.shelltopia.org
                impersonation:
                  username: "'oidc:' + claims.preferred_username"
                  groups: "has(claims.groups) ? claims.groups.map(g, 'oidc:' + g) : []"
  data:
    - secretKey: clientID
      remoteRef:
        key: pocket-id-flux/username
    - secretKey: clientSecret
      remoteRef:
        key: pocket-id-flux/credential
