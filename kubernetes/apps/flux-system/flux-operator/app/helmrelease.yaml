---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: flux-operator
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # The refresh of flux_resource_info, which the Flux alerts read (prometheusrule.yaml): 30s, as
    # the documentation of the operator advises when its metrics are scraped (default 5m).
    reporting:
      interval: 30s
    # Not system-cluster-critical (the advice of the chart): the cluster keeps running without
    # Flux (docs/cluster/README.md#resources-and-priorities).
    priorityClassName: infrastructure
    # From the usage (docs/conventions.md#resources-and-priorities).
    resources:
      requests:
        cpu: 15m
        memory: 320Mi
      limits:
        # Helm merges maps: null removes the CPU limit of the chart.
        cpu: null
        memory: 640Mi
    serviceMonitor:
      create: true
    web:
      # The Web Config of the UI (OIDC on the Pocket ID), rendered by an ExternalSecret of the
      # Kustomization flux-operator-web (../web/externalsecret.yaml). Watched by the operator: missing
      # or invalid, the UI answers 503 and the operator keeps running. Not `web.config` nor
      # `valuesFrom`: the bootstrap helmfile reads `spec.values` only, and a partial OAuth2 config in
      # a file stops the operator (docs/cluster/README.md#flux-web-ui).
      configSecretName: flux-operator-web-config
      # No NetworkPolicy: it would open the web UI (9080) to every namespace, over the Cilium
      # baseline (docs/cluster/README.md#network-policies).
      networkPolicy:
        create: false
      # Not the roles flux-web-user and flux-web-admin: the first reads the Secrets, the second
      # adds nothing to cluster-admin. The UI acts as the user, with the bindings of the OIDC
      # groups (kubernetes/apps/kube-system/oidc).
      rbac:
        createRoles: false
      # Not the route of the chart: the bootstrap installs the operator before the Gateway API
      # CRDs. The route is ../web/httproute.yaml.
