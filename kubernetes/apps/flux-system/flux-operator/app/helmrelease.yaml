---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: flux-operator
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    serviceMonitor:
      create: false
    web:
      # No NetworkPolicy: it would open the web UI (9080) to every namespace, over the Cilium
      # baseline (docs/cluster/README.md#network-policies).
      networkPolicy:
        create: false
