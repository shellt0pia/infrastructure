---
# The GUI and the API it calls share one OIDC policy. Do not route /metrics.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: linstor-gui
spec:
  hostnames:
    - linstor.shelltopia.org
  parentRefs:
    - name: internal
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /ui
        - path:
            type: PathPrefix
            value: /v1
        # Linstor gateway API, not deployed in this cluster for now.
        # - path:
        #     type: PathPrefix
        #     value: /api
        - path:
            type: Exact
            value: /oauth2/callback
        - path:
            type: Exact
            value: /logout
      backendRefs:
        - name: linstor-controller
          port: 3370
---
# Redirect before login. This route has no backend; /ui/ still requires OIDC.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: linstor-gui-redirect
spec:
  hostnames:
    - linstor.shelltopia.org
  parentRefs:
    - name: internal
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /ui/
            statusCode: 302
