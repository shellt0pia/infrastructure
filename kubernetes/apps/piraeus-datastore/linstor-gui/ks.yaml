---
# Keep the route separate so storage does not depend on Envoy Gateway or External Secrets.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: linstor-gui
spec:
  dependsOn:
    - name: piraeus-cluster
    - name: gateways
      namespace: network
    - name: external-secrets-stores
      namespace: external-secrets
  interval: 1h
  path: ./kubernetes/apps/piraeus-datastore/linstor-gui/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: piraeus-datastore
  wait: true
