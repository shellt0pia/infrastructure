---
apiVersion: v1
kind: Namespace
metadata:
  name: piraeus-datastore
  annotations:
    # Never delete a namespace (and everything in it) because of a refactoring.
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    # The LINSTOR satellites, the CSI node plugin and the HA controller need privileged pods
    # (host devices, DRBD, LVM, mounts): the Talos default (baseline) would reject them.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
