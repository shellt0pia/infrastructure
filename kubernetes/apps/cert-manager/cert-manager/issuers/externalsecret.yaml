---
# Cloudflare API token used by the DNS-01 solvers of both ClusterIssuers.
# It must live in the cert-manager namespace (the cluster resource namespace),
# otherwise the ClusterIssuers cannot read it.
# Keep the refresh interval long: 1Password rate-limits the service account.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: cloudflare-api-token
    creationPolicy: Owner
  data:
    - secretKey: api-token
      remoteRef:
        key: cloudflare-cert-manager/credential
