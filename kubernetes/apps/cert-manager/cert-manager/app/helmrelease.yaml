---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: cert-manager
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    crds:
      enabled: true
      # Keep the CRDs (and therefore every Certificate) if the release is ever uninstalled.
      keep: true
    # The internal DNS is split-horizon (Unbound overrides shelltopia.net and forwards
    # shelltopia.org to k8s-gateway, which knows nothing of the challenges): the DNS-01
    # propagation check must only query public resolvers, never the cluster resolver.
    dns01RecursiveNameserversOnly: true
    dns01RecursiveNameservers: "1.1.1.1:53,1.0.0.1:53,[2606:4700:4700::1111]:53,[2606:4700:4700::1001]:53"
    prometheus:
      enabled: true
      servicemonitor:
        # Enable once the Prometheus Operator CRDs are installed.
        enabled: false
