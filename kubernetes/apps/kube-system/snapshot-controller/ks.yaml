---
# CSI snapshot controller and the snapshot.storage.k8s.io CRDs, shared by every CSI driver
# (LINSTOR for now). Lives in kube-system like the upstream deployment
# (kubernetes-csi/external-snapshotter). The VolumeSnapshotClass of each driver is managed with
# the driver itself (see piraeus-datastore/piraeus-operator/cluster).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: snapshot-controller
spec:
  interval: 1h
  path: ./kubernetes/apps/kube-system/snapshot-controller/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: kube-system
  wait: true
