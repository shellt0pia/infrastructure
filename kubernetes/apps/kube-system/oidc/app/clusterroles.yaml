---
# What `view` lacks for a read-only user of Headlamp and the Flux UI: the cluster-scoped resources
# of the core and the resources of flux-operator not aggregated to `view`. Read only, never the
# Secrets. Not the other CRDs (Gateway API, cert-manager, Cilium...): RBAC has no "all but
# Secrets", each new CRD would have to be listed (docs/cluster/README.md#oidc-authentication).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: oidc:cluster-view
rules:
  - apiGroups:
      - ""
    resources:
      - nodes
      - persistentvolumes
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - storage.k8s.io
    resources:
      - storageclasses
      - csinodes
      - volumeattachments
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - scheduling.k8s.io
    resources:
      - priorityclasses
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - fluxcd.controlplane.io
    resources:
      - fluxinstances
      - fluxreports
    verbs:
      - get
      - list
      - watch
