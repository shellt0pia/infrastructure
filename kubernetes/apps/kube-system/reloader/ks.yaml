---
# Reloader restarts the workloads that opt in when a ConfigMap or a Secret they reference
# changes (tokens rotated in 1Password and synced by External Secrets). Lives in kube-system
# with the other cluster-wide tools. Opt-in rule: docs/conventions.md, details:
# docs/cluster/README.md.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: reloader
spec:
  interval: 1h
  path: ./kubernetes/apps/kube-system/reloader/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: kube-system
  wait: true
