---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: cilium
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # Talos requirements, see https://docs.siderolabs.com/kubernetes-guides/cni/deploying-cilium
    ipam:
      # Pod CIDRs allocated by kube-controller-manager from the cluster ranges (talos/vars.yaml).
      mode: kubernetes
    cgroup:
      # cgroup2 is already mounted by Talos.
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup
    securityContext:
      capabilities:
        # Chart defaults without SYS_MODULE: Talos does not let workloads load kernel modules.
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
          - SYSLOG
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE

    # kube-proxy replacement (kube-proxy is disabled in the Talos config). The API server is
    # reached through KubePrism, the Talos local load balancer: it works before any Service exists.
    kubeProxyReplacement: true
    k8sServiceHost: 127.0.0.1
    k8sServicePort: 7445

    # Dual-stack, same ranges as talos/vars.yaml (cluster.pod_subnets).
    ipv4:
      enabled: true
    ipv6:
      enabled: true
    # All the nodes share the same L2 segment: plain routes to the pod CIDRs of the other nodes,
    # through their node IPs (IPv4 and ULA), no tunnel and no MTU overhead.
    routingMode: native
    autoDirectNodeRoutes: true
    ipv4NativeRoutingCIDR: 10.244.0.0/16
    ipv6NativeRoutingCIDR: fd1b:654d:9afe:100::/56

    # Traffic leaving the cluster is masqueraded behind the node addresses (the pod ranges are
    # not routed outside of the cluster), for both families.
    # iptables masquerading (the default), not the eBPF one (`bpf.masquerade`): the eBPF one
    # always uses the "primary" IPv6 address of the node, and Cilium prefers public addresses,
    # so every IPv6 connection would come from the GUA address, even towards the ULA addresses
    # of the NAS or OPNsense. With iptables (MASQUERADE target), the kernel picks the source
    # address for each destination (RFC 6724): ULA towards ULA, GUA towards the Internet.
    # Downside: no eBPF host routing, so no BBR for the pods (bandwidthManager), which is
    # negligible on a 1 Gbit/s network.
    # It also avoids the known issue between `bpf.masquerade` and the Talos host DNS
    # (`forwardKubeDNSToHost`), which stays enabled.
    bpf:
      masquerade: false
    enableIPv4Masquerade: true
    enableIPv6Masquerade: true

    # Advertises the LoadBalancer IPs to OPNsense. The sessions, the advertisements and the IP
    # pools are in ../networking.
    bgpControlPlane:
      enabled: true

    # Network policies, see docs/cluster/README.md#network-policies. The host firewall applies
    # the CiliumClusterwideNetworkPolicies with a nodeSelector to the nodes themselves (the
    # hostNetwork pods included), the policies are in ../policies.
    hostFirewall:
      enabled: true
    # Enforced: the denied flows are dropped. true is the audit mode (reported by Hubble with the
    # verdict AUDIT, nothing dropped), to roll out a change of the policies or to diagnose, see
    # docs/cluster/runbook.md#network-policies.
    policyAuditMode: false

    # Hubble (enabled by default), its Relay for the `hubble` CLI (`hubble observe` sees the flows
    # of every node) and its UI, behind a login on the Pocket ID done by Envoy
    # (../hubble-ui, docs/cluster/README.md#network-policies).
    hubble:
      relay:
        enabled: true
        rollOutPods: true
      # No login of its own: never exposed without the SecurityPolicy of ../hubble-ui. Its backend
      # reads Relay and the API server with its own ServiceAccount (read-only ClusterRole).
      ui:
        enabled: true
        rollOutPods: true
        # To resize from the metrics.
        backend:
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
        frontend:
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      tls:
        auto:
          # The certificates of Hubble are regenerated by a CronJob (every 4 months). With the
          # default `helm` method, Helm reuses the existing ones, which then expire after a year.
          method: cronJob
      # The flows denied by the policies (AUDIT in audit mode, DROPPED once enforced, with the
      # other drops) are written as JSON lines to /var/run/cilium/hubble/events.log on each node:
      # Hubble only keeps the last 4095 flows in memory. Read by the log collector later, see
      # docs/cluster/runbook.md#network-policies. /var/run is a tmpfs on Talos: lost at reboot,
      # 60 MB at most (10 MB files, 5 rotated ones). Not exported: the Router Solicitations the
      # pods send from their link-local address, dropped by the datapath of Cilium as
      # INVALID_SOURCE_IP, harmless (docs/cluster/README.md#network-policies).
      export:
        static:
          enabled: true
          allowList:
            - '{"verdict":["AUDIT","DROPPED"]}'
          denyList:
            - '{"drop_reason_desc":["INVALID_SOURCE_IP"],"source_ip":["fe80::/10"],"destination_ip":["ff02::2"]}'
      # Flow metrics, for the dashboard and the alert of the denied flows
      # (docs/observability/README.md#metrics): `drop` counts the dropped packets by reason,
      # `policy` the policy verdicts (`action="audit"` in audit mode). At each end: the namespace
      # (`source_namespace`, `destination_namespace`), and in `source`/`destination` the workload,
      # else the app label (Hubble only knows the workload of the pods of its own node), else the
      # reserved identity (`reserved:host`, `reserved:world`...).
      metrics:
        enabled:
          - drop:labelsContext=source_namespace,destination_namespace;sourceContext=workload-name|app|reserved-identity;destinationContext=workload-name|app|reserved-identity
          - policy:labelsContext=source_namespace,destination_namespace;sourceContext=workload-name|app|reserved-identity;destinationContext=workload-name|app|reserved-identity
        serviceMonitor:
          enabled: true
        # Dashboards of this chart version (docs/observability/README.md#dashboards), see
        # `dashboards` below. The DNS and L7 HTTP ones stay empty: those metrics are not enabled.
        dashboards:
          enabled: true
          namespace: observability

    # Restart the pods when the Cilium configuration changes.
    rollOutCiliumPods: true
    operator:
      rollOutPods: true
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
      dashboards:
        enabled: true
        namespace: observability

    # Metrics of the agent (:9962), the operator (:9963) and Hubble (:9965), all in the host
    # network, scraped by VMAgent through the ServiceMonitors (docs/observability/README.md#metrics).
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
        # Without it, the chart refuses to render the ServiceMonitors when the API is missing from
        # the capabilities (an offline render). The CRDs are always applied first (`just
        # bootstrap crds`).
        trustCRDsExist: true

    # Dashboards of the agent, the operator and Hubble, matching this chart version: ConfigMaps
    # labeled grafana_dashboard="1", created in the namespace of Grafana for its sidecar (also at
    # the bootstrap: the helmfile creates the namespace first). Their DS_PROMETHEUS variable
    # picks the default Prometheus data source, VictoriaMetrics.
    dashboards:
      enabled: true
      namespace: observability
