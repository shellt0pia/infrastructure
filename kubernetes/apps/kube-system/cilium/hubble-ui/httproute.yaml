---
# Hubble UI (deployed by the release of Cilium), on the internal Gateway only: it shows every flow
# of the cluster. The login is the SecurityPolicy of this route (securitypolicy.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui
spec:
  hostnames:
    - hubble.shelltopia.org
  parentRefs:
    - name: internal
      namespace: network
  rules:
    - backendRefs:
        - name: hubble-ui
          port: 80
