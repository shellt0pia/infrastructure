---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-device-plugin-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: intel-device-plugin-operator
  install:
    # The CRDs live in the crds/ directory of the chart: let Helm upgrade them too.
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    manager:
      # Only reconcile GpuDevicePlugin resources. This also drops the SGX mutating webhook,
      # which would otherwise intercept the creation of every pod in the cluster.
      devices:
        gpu: true
    # From the usage (docs/conventions.md#resources-and-priorities).
    resources:
      requests:
        cpu: 5m
        memory: 32Mi
      limits:
        # Helm merges maps: null removes the CPU limit of the chart.
        cpu: null
        memory: 64Mi
  # The chart has no value for the class. The GPU plugin keeps the one its operator sets.
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              kind: Deployment
              name: inteldeviceplugins-controller-manager
            patch: |
              - op: add
                path: /spec/template/spec/priorityClassName
                value: infrastructure
