---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-media
  annotations:
    # Keep the binding through a Flux refactoring; the NAS owns the data.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  capacity:
    storage: 100Ti # Kubernetes matching only, not a NAS quota
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions: [nfsvers=4.2]
  nfs:
    server: nas-01-dmz.shelltopia.net
    path: /mnt/vault/media
  claimRef:
    namespace: media
    name: media
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media
  annotations:
    # Keep the binding through a Flux refactoring.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: media-media
  resources:
    requests:
      storage: 100Ti
