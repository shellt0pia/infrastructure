---
# Daily backup of the PVC of the application: a CSI snapshot (crash-consistent, the application
# keeps running), cloned into a temporary volume that restic backs up, then deleted.
# Retention: 28 daily, 8 weekly, 6 monthly (`restic forget` after each backup). The prune, which
# frees the space, runs separately every 7 days.
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: ${APP}
spec:
  sourcePVC: ${APP}
  trigger:
    # UTC (time zone of the controller).
    schedule: "${VOLSYNC_SCHEDULE:=30 1 * * *}"
  restic:
    repository: ${APP}-volsync
    copyMethod: Snapshot
    volumeSnapshotClassName: linstor
    # Same resource group as `replicated`, deleted with the PVC (see storageclasses.yaml).
    storageClassName: replicated-temporary
    cacheStorageClassName: replicated-temporary
    pruneIntervalDays: 7
    retain:
      daily: 28
      weekly: 8
      monthly: 6
    # The default of every application (docs/conventions.md#resources-and-priorities). restic writes
    # its packs to /tmp, a memory emptyDir of the mover, and its buffers grow with the CPUs of the
    # node (no CPU limit). Measured with restic on 12 CPUs: 520 MiB for a first backup of 1 GiB
    # (440 MiB RSS, 80 MiB in /tmp), 60 to 160 MiB for the next ones. The request covers the daily
    # runs, the limit the first one: not twice the request, the movers of every application start
    # at the same time. No field for the class: the one of the application.
    moverResources:
      requests:
        cpu: 10m
        memory: 256Mi
      limits:
        memory: 1Gi
    moverSecurityContext:
      runAsNonRoot: true
      runAsUser: ${VOLSYNC_UID:=1000}
      runAsGroup: ${VOLSYNC_GID:=1000}
      fsGroup: ${VOLSYNC_GID:=1000}
      seccompProfile:
        type: RuntimeDefault
