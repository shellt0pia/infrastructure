---
# Restic repository of the volume: one repository per application, under the common prefix of
# the VolSync bucket (`repository` field, e.g. s3:https://s3.<region>.backblazeb2.com/<bucket>).
# Same password and B2 application key for every application.
# Keep the refresh interval long: 1Password rate-limits the service account, and every backed up
# application has one of these.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-volsync
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: ${APP}-volsync
    creationPolicy: Owner
    template:
      data:
        RESTIC_REPOSITORY: "{{ .repository }}/${APP}"
        RESTIC_PASSWORD: "{{ .password }}"
        AWS_ACCESS_KEY_ID: "{{ .access_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ .secret_access_key }}"
  data:
    - secretKey: repository
      remoteRef:
        key: restic-volsync/repository
    - secretKey: password
      remoteRef:
        key: restic-volsync/password
    - secretKey: access_key_id
      remoteRef:
        key: restic-volsync/access-key-id
    - secretKey: secret_access_key
      remoteRef:
        key: restic-volsync/secret-access-key
