---
# The Alertmanager of the observability namespace. The notification-controller sends the events
# with `severity=error` and an `alertname` of `Flux<Kind><Reason>`, without end time: the
# Alertmanager resolves them after its `resolve_timeout` (1h).
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: alertmanager
spec:
  type: alertmanager
  address: http://vmalertmanager-victoria-metrics-k8s-stack.observability.svc.cluster.local:9093/api/v2/alerts/
---
# The errors of every Flux object of the namespace. FluxInstance: the events of the
# flux-operator, in flux-system only.
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: alertmanager
spec:
  providerRef:
    name: alertmanager
  eventSeverity: error
  eventSources:
    - kind: GitRepository
      name: "*"
    - kind: OCIRepository
      name: "*"
    - kind: HelmRepository
      name: "*"
    - kind: HelmChart
      name: "*"
    - kind: Kustomization
      name: "*"
    - kind: HelmRelease
      name: "*"
    - kind: FluxInstance
      name: "*"
