          name: '{{ groupware_provider.name }}'
          url: ''
          user: '{{ groupware_provider.user }}'
          password: ''
        caldav:
          name: '{{ groupware_provider.name }}'
          url: ''
          user: '{{ groupware_provider.user }}'
          password: ''
        healthchecks_uuid: ''
      borgmatic:
        ssh_key:
          private: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            xxx
            -----END OPENSSH PRIVATE KEY-----
          public: 'ssh-ed25519 xxx'
        documents:
          repository: ''
          encryption_passphrase: ''
          healthchecks_uuid: ''
        groupware:
          repository: ''
          encryption_passphrase: ''
          healthchecks_uuid: ''
        medias:
          repository: ''
          encryption_passphrase: ''
          healthchecks_uuid: ''
        servers:
          repository: ''
          encryption_passphrase: ''
          healthchecks_uuid: ''
