          020932
          803780
          742117
          859969
          595151
      storage_server:
        name: 'nas'
        fqdn: 'nas.domain.tld'
        type: 'nfs'
        shares_base_path: '/mnt/nas'
      storage_server_shares:
        - name: 'backups/documents'
        - name: 'backups/groupware'
        - name: 'backups/servers'
        - name: 'media'
      traefik:
        api:
          user: ''
          password_hash: '' # podman run -it --rm quay.io/coreos/mkpasswd --method=bcrypt
