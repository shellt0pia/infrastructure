    remote_gateways:
      hosts:
        gateway0:
    hypervisors:
      hosts:
        hypervisor:
    home_hosts:
      hosts:
        backups:
        monitoring:
        home:
        medias:
      vars:
    cloud_hosts:
      hosts:
        documents:
    containers_hosts:
      hosts:
        backups:
        monitoring:
        home:
        documents:
        medias:
      vars:
        containers_ipv6:
          enable: true
        containers_storage_path: '/var/containers'
        containers_registries:
          - registry: 'docker.io'
            username: ''
            password: ''
        backup_server_key: 'ssh-ed25519 xxx' # Public key part of the key generated for hostvars['backups']['rsync_servers']['private_key']
        promtail:
          clients:
            basic_auth:
              user: ''
              password: ''
        node_exporter:
          user: '' # Same user as hostvars['monitoring']['prometheus']['scrape_configs']['node']['basic_auth']['user']
          password_hash: '' # Hash password created for hostvars['monitoring']['prometheus']['scrape_configs']['node']['basic_auth']['password'] with podman run -it --rm quay.io/coreos/mkpasswd --method=bcrypt
        systemd_exporter:
          user: '' # Same user as hostvars['monitoring']['prometheus']['scrape_configs']['node']['basic_auth']['user']
          password_hash: '' # Hash password created for hostvars['monitoring']['prometheus']['scrape_configs']['node']['basic_auth']['password'] with podman run -it --rm quay.io/coreos/mkpasswd --method=bcrypt
    nfs_clients:
      hosts:
        backups:
        medias:
      vars:
        storage_server_shares_mounts_path: '/var/mnt/{{ storage_server.name }}'
    cifs_clients:
      hosts:
        documents:
      vars:
        storage_server_shares_mounts_path: '/var/mnt/{{ storage_server.name }}'
