            host: ''
            port: ''
            starttls: ''
            ssl: ''
            user: ''
            password: ''
          pushover:
            api_token: ''
            subscription_url: ''
          secret_key: '' # cat /dev/urandom | tr -dc '[:graph:]' | fold -w 50 | head -n 1
