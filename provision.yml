- name: 'Containers hosts base configuration'
  hosts: 'containers_hosts'
  roles:
    - 'fedora_coreos_setup'
    - 'podman_setup'

- name: 'Common containers'
  hosts: 'containers_hosts'
  roles:
    - 'cloudflare_ddns'
    - 'traefik'
    - 'cockpit'
    - 'sshd_rsync'
    # - 'promtail'
    # - 'node_exporter'
    # - 'systemd_exporter'

- name: 'Backups containers'
  hosts: 'medias'
  roles:
    - 'rsync_servers'
    - 'mbsync'
    - 'vdirsyncer'
    - 'borgmatic'
    - 'autorestic'

- name: 'Monitoring containers'
  hosts: 'medias'
  roles:
    - 'uptime_kuma'
    - 'healthchecks'
    # - 'grafana'
    # - 'prometheus'
    # - 'loki'
    # - 'syslog_ng'

# - name: 'Home containers'
#   hosts: 'medias'
#   roles:
#     - 'home_assistant'

- name: 'Documents containers'
  hosts: 'documents'
  roles:
    - 'nextcloud'
    - 'collabora_online'
    - 'stirling_pdf'
    - 'immich'
    - 'ttrss'
    - 'freshrss'
    - 'it_tools'

- name: 'Medias containers'
  hosts: 'medias'
  roles:
    - 'plex'
    - 'tautulli'
    - 'navidrome'
    - 'calibre'
    - 'calibre_web'
    - 'komga'
    - 'transmission'
    - 'sabnzbd'
    - 'cross_seed'
    - 'flaresolverr'
