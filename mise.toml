# Tools needed to manage the infrastructure: `mise install`, then `mise activate` in the shell.
# Versions are updated by Renovate.

[env]
KUBECONFIG = "{{ config_root }}/kubeconfig"
TALOSCONFIG = "{{ config_root }}/talosconfig"
MINIJINJA_CONFIG_FILE = "{{ config_root }}/.minijinja.toml"

[tools]
# Same versions as the cluster (talos/vars.yaml), Renovate updates them together.
"aqua:kubernetes/kubernetes/kubectl" = "1.37.1"
"aqua:siderolabs/talos" = "1.14.4"

"aqua:helm/helm" = "4.3.1"
"aqua:helmfile/helmfile" = "1.8.2"
"aqua:fluxcd/flux2" = "2.9.6"
"aqua:opentofu/opentofu" = "1.13.1"

"aqua:mitsuhiko/minijinja" = "latest"
"aqua:mikefarah/yq" = "latest"
"aqua:google/yamlfmt" = "latest"
"aqua:coreos/butane" = "latest"
# Structured logs of the just recipes.
"aqua:charmbracelet/gum" = "latest"
# Backups (`just kube volsync-*`, docs/backups/runbook.md). rclone reads the hidden B2 versions.
"aqua:restic/restic" = "latest"
"aqua:rclone/rclone" = "latest"
# `kubectl linstor`: LINSTOR client of the controller pod, `pvc:` and `pod:`
# arguments, sos-report download. Not in the aqua registry: GitHub releases.
"github:piraeusdatastore/kubectl-linstor" = "latest"

# Python tools are installed in isolated environments with uv.
"aqua:astral-sh/uv" = "latest"
# The ansible-* executables come from the ansible-core dependency.
"pypi:ansible" = "latest"
"pypi:ansible-core" = "latest"
"pypi:ansible-lint" = "latest"
# B2 CLI (tofu/README.md#setup, docs/backups/runbook.md): not in the aqua registry.
"pypi:b2" = "latest"
