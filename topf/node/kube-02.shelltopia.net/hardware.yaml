---
# Dell OptiPlex 3000 Micro (i5-12500T, 16 GiB, UHD 770).
# Still the `home` host managed by Ansible, see topf.yaml.
apiVersion: v1alpha1
kind: UnattendedInstallConfig
provisioning:
  diskSelector:
    # TODO: WWID of the SATA SSD Crucial BX500 240 GB once installed (Talos leaves the serial
    # of SATA disks behind AHCI controllers empty), see
    # `talosctl get disks --insecure --nodes kube-02.shelltopia.net` in maintenance mode.
    match: disk.wwid == "TODO"
---
# NVMe SSD Crucial P310 1 TB, see all/storage.yaml.
apiVersion: v1alpha1
kind: RawVolumeConfig
name: storage
provisioning:
  diskSelector:
    # TODO: serial of the NVMe SSD (same command as above).
    match: disk.serial == "TODO"
---
# Realtek RTL8111 onboard NIC.
apiVersion: v1alpha1
kind: LinkAliasConfig
name: lan0
selector:
  match: mac(link.permanent_addr) == "6c:3c:8c:18:d9:1b"
---
# Wake-on-LAN: Talos v1.14 does not resolve link aliases in EthernetConfig (the name is passed
# as is to ethtool), the kernel interface name must be used. The r8169 driver disables
# Wake-on-LAN by default.
# TODO: check the interface name in maintenance mode (`talosctl get links --insecure`), it
# should be enp2s0 like kube-01.
apiVersion: v1alpha1
kind: EthernetConfig
name: enp2s0
wakeOnLan:
  - magic
---
# Only the UHD 770 iGPUs are used for workloads: the Intel GPU device plugin is scheduled
# on the nodes with this label.
apiVersion: v1alpha1
kind: KubeNodeConfig
labels:
  shelltopia.net/intel-gpu: "true"
