---
- name: 'Create/Update Pocket ID CNAME record'
  community.general.cloudflare_dns:
    api_token: '{{ cloudflare_dns_token }}'
    zone: '{{ domain_name }}'
    record: 'id'
    ttl: 3600
    type: 'CNAME'
    value: '{{ ansible_facts["fqdn"] }}'
    proxied: false
    state: 'present'
  delegate_to: 'localhost'

- name: 'Create Pocket ID data bind mount path'
  ansible.builtin.file:
    path: '{{ containers_storage_path }}/data/pocket-id'
    owner: 1000
    group: 1000
    mode: '0700'
    state: 'directory'

- name: 'Get traefik container network info'
  containers.podman.podman_network_info:
    name: 'common-internal'
  register: 'traefik_podman_network'

- name: 'Create Pocket ID secret'
  containers.podman.podman_secret:
    name: 'pocket_id_encryption_key'
    data: '{{ pocket_id.encryption_key }}'
    skip_existing: true
    state: 'present'
  register: 'podman_secret'

- name: 'Create Pocket ID quadlet unit from template'
  ansible.builtin.template:
    src: 'pocket-id.container.j2'
    dest: '/etc/containers/systemd/pocket-id.container'
    owner: 'root'
    group: 'root'
    mode: '0644'
  register: 'quadlet_unit'
  notify: 'Reload systemd daemon'

- name: 'Enable and start Pocket ID container'
  ansible.builtin.systemd_service:
    name: 'pocket-id.service'
    daemon_reload: true
    enabled: true
    state: 'started'
  register: 'systemd_start'

- name: 'Restart Pocket ID service if podman secret or quadlet unit has changed while service was already started'
  ansible.builtin.systemd_service:
    name: 'pocket-id.service'
    daemon_reload: true
    state: 'restarted'
  when: ((podman_secret.changed or quadlet_unit.changed) and not systemd_start.changed)
