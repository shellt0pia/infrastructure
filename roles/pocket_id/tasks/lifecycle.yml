---
- name: 'Pull Pocket ID image'
  containers.podman.podman_image:
    name: '{{ containers_images.pocket_id }}:{{ containers_images_tags.pocket_id }}'
    pull: true
    force: true
    state: 'present'
  register: 'container_image_pull'
  tags: ['never', 'containers-pull', 'containers-update']

- name: 'Get traefik container network info' # noqa: no-handler
  containers.podman.podman_network_info:
    name: 'common-internal'
  when: (container_image_pull.changed)
  register: 'traefik_podman_network'
  tags: ['never', 'containers-update']

- name: 'Update Pocket ID tag in quadlet unit' # noqa: no-handler
  ansible.builtin.template:
    src: 'pocket-id.container.j2'
    dest: '/etc/containers/systemd/pocket-id.container'
    owner: 'root'
    group: 'root'
    mode: '0644'
  when: (container_image_pull.changed)
  register: 'quadlet_unit'
  tags: ['never', 'containers-update']

- name: 'Restart Pocket ID container'
  ansible.builtin.systemd_service:
    name: 'pocket-id.service'
    daemon_reload: '{{ ("true" | bool) if quadlet_unit.changed else ("false" | bool) }}'
    state: 'restarted'
  when: ("containers-restart" in ansible_run_tags or
        ("containers-update" in ansible_run_tags and container_image_pull.changed))
  tags: ['never', 'containers-restart', 'containers-update']

- name: 'Disable Pocket ID container'
  ansible.builtin.systemd_service:
    name: 'pocket-id.service'
    enabled: false
  tags: ['never', 'containers-disable']

- name: 'Stop Pocket ID container'
  ansible.builtin.systemd_service:
    name: 'pocket-id.service'
    state: 'stopped'
  tags: ['never', 'containers-stop']

- name: 'Enable Pocket ID container'
  ansible.builtin.systemd_service:
    name: 'pocket-id.service'
    enabled: true
  tags: ['never', 'containers-enable']

- name: 'Start Pocket ID container'
  ansible.builtin.systemd_service:
    name: 'pocket-id.service'
    state: 'started'
  tags: ['never', 'containers-start']
