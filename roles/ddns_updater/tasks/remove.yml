---
- name: 'Ensure the user really wants to remove the DDNS Updater container'
  ansible.builtin.pause:
    prompt: "WARNING! DO YOU REALLY WANT TO REMOVE THE DDNS UPDATER CONTAINER?\nTHIS ACTION WILL DELETE ALL DDNS UPDATER APP DATA AND IS IRREVERSIBLE!\nAnswer yes in capital letters to confirm"
    echo: true
  register: remove_prompt

- name: "Stop execution if user didn't answer 'YES'"
  ansible.builtin.fail:
    msg: "Stopping playbook execution because the playbook was called with the tag 'containers-remove' but the user didn't want to remove the containers."
  when: (remove_prompt.user_input != "YES")

- name: 'Disable and stop DDNS Updater container'
  ansible.builtin.systemd_service:
    name: 'ddns-updater.service'
    daemon_reload: true
    enabled: false
    state: 'stopped'
  register: systemd_unit
  failed_when: (systemd_unit.failed and not "Could not find the requested service" in systemd_unit.msg)

- name: 'Remove DDNS Updater container quadlet unit'
  ansible.builtin.file:
    path: '/etc/containers/systemd/ddns-updater.container'
    state: 'absent'
  notify: 'Reload systemd daemon'

- name: 'Remove DDNS Updater bind mounts paths'
  ansible.builtin.file:
    path: '{{ containers_storage_path }}/{{ item }}'
    state: 'absent'
  loop:
    - 'env/ddns-updater'
    - 'data/ddns-updater'
