---
- name: 'Pull cross-seed image'
  containers.podman.podman_image:
    name: '{{ containers_images.cross_seed }}:{{ containers_images_tags.cross_seed }}'
    pull: true
    force: true
    state: 'present'
  register: 'container_image_pull'
  tags: ['never', 'containers-pull', 'containers-update']

- name: 'Update cross-seed tag in quadlet unit' # noqa: no-handler
  ansible.builtin.template:
    src: 'cross-seed.container.j2'
    dest: '/etc/containers/systemd/cross-seed.container'
    owner: 'root'
    group: 'root'
    mode: '0644'
  when: (container_image_pull.changed)
  register: 'quadlet_unit'
  tags: ['never', 'containers-update']

- name: 'Restart cross-seed container'
  ansible.builtin.systemd_service:
    name: 'cross-seed.service'
    daemon_reload: '{{ ("true" | bool) if quadlet_unit.changed else ("false" | bool) }}'
    state: 'restarted'
  when: ("containers-restart" in ansible_run_tags or
        ("containers-update" in ansible_run_tags and container_image_pull.changed))
  tags: ['never', 'containers-restart', 'containers-update']

- name: 'Disable cross-seed container'
  ansible.builtin.systemd_service:
    name: 'cross-seed.service'
    enabled: false
  tags: ['never', 'containers-disable']

- name: 'Stop cross-seed container'
  ansible.builtin.systemd_service:
    name: 'cross-seed.service'
    state: 'stopped'
  tags: ['never', 'containers-stop']

- name: 'Enable cross-seed container'
  ansible.builtin.systemd_service:
    name: 'cross-seed.service'
    enabled: true
  tags: ['never', 'containers-enable']

- name: 'Start cross-seed container'
  ansible.builtin.systemd_service:
    name: 'cross-seed.service'
    state: 'started'
  tags: ['never', 'containers-start']
