---
- name: 'Create cross-seed data bind mount path'
  ansible.builtin.file:
    path: '{{ containers_storage_path }}/data/cross-seed'
    owner: 911
    group: 911
    mode: '0700'
    state: 'directory'

- name: 'Create cross-seed quadlet unit from template'
  ansible.builtin.template:
    src: 'cross-seed.container.j2'
    dest: '/etc/containers/systemd/cross-seed.container'
    owner: 'root'
    group: 'root'
    mode: '0644'
  register: 'quadlet_unit'
  notify: 'Reload systemd daemon'

- name: 'Enable and start cross-seed container'
  ansible.builtin.systemd_service:
    name: 'cross-seed.service'
    daemon_reload: true
    enabled: true
    state: 'started'
  register: 'systemd_start'

- name: 'Restart cross-seed service if quadlet unit has changed while service was already started'
  ansible.builtin.systemd_service:
    name: 'cross-seed.service'
    daemon_reload: true
    state: 'restarted'
  when: (quadlet_unit.changed and not systemd_start.changed)
