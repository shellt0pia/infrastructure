---
- name: 'Create cross-seed bind mounts paths'
  ansible.builtin.file:
    path: '{{ containers_storage_path }}/{{ item }}'
    owner: 911
    group: 911
    mode: '0700'
    state: 'directory'
  loop:
    - 'config/cross-seed'
    - 'data/cross-seed'

- name: 'Create cross-seed config from template'
  ansible.builtin.template:
    src: 'config.js.j2'
    dest: '{{ containers_storage_path }}/config/cross-seed/config.js'
    owner: 911
    group: 911
    mode: '0644'
  register: 'configuration_file'

- name: 'Create cross-seed quadlet unit from template'
  ansible.builtin.template:
    src: 'cross-seed.container.j2'
    dest: '/etc/containers/systemd/cross-seed.container'
    owner: 'root'
    group: 'root'
    mode: '0644'
  register: 'quadlet_unit'
  notify: 'Reload systemd daemon'

- name: 'Enable and start cross-seed container'
  ansible.builtin.systemd_service:
    name: 'cross-seed.service'
    daemon_reload: true
    enabled: true
    state: 'started'
  register: 'systemd_start'

- name: 'Restart cross-seed service if configuration file or quadlet unit has changed while service was already started'
  ansible.builtin.systemd_service:
    name: 'cross-seed.service'
    daemon_reload: true
    state: 'restarted'
  when: ((configuration_file.changed or quadlet_unit.changed) and not systemd_start.changed)
