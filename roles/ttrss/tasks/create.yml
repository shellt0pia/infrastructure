---
- name: 'Create/Update Tiny Tiny RSS CNAME record'
  community.general.cloudflare_dns:
    api_token: '{{ cloudflare_dns_token }}'
    zone: '{{ domain_name }}'
    record: 'ttrss'
    ttl: 3600
    type: 'CNAME'
    value: '{{ ansible_facts["fqdn"] }}'
    proxied: false
    state: 'present'
  delegate_to: 'localhost'

- name: 'Create Tiny Tiny RSS stack networks'
  containers.podman.podman_network:
    name: '{{ item }}'
    internal: true
    ipv6: '{{ containers_ipv6.enable }}'
    opt:
      isolate: true
  loop:
    - 'ttrss-postgres-internal'
    - 'ttrss-server-internal'

- name: 'Add Tiny Tiny RSS stack networks to firewalld trusted zone'
  block:
    - name: 'Get podman networks info'
      containers.podman.podman_network_info:
        name: '{{ item }}'
      loop:
        - 'ttrss-postgres-internal'
        - 'ttrss-server-internal'
      register: 'podman_networks'

    - name: 'Add podman networks subnets to firewalld trusted zone'
      ansible.posix.firewalld:
        source: '{{ item }}'
        zone: 'trusted'
        permanent: true
        immediate: true
        state: 'enabled'
      loop: '{{ podman_networks.results | community.general.json_query("[*].networks[*].subnets[*].subnet") | ansible.builtin.flatten }}'

- name: 'Create Tiny Tiny RSS stack bind mounts paths'
  ansible.builtin.file:
    path: '{{ item.path }}'
    owner: '{{ item.owner }}'
    group: '{{ item.group }}'
    mode: '{{ item.mode }}'
    state: 'directory'
  loop:
    - path: '{{ containers_storage_path }}/env/ttrss-server'
      owner: 'root'
      group: 'root'
      mode: '0700'
    - path: '{{ containers_storage_path }}/data/ttrss-postgres'
      owner: 'root'
      group: 'root'
      mode: '0700'
    - path: '{{ containers_storage_path }}/data/ttrss-server'
      owner: 1000
      group: 1000
      mode: '2755'
    - path: '{{ containers_storage_path }}/runtime/ttrss-postgres'
      owner: 999
      group: 999
      mode: '0700'

- name: 'Create Tiny Tiny RSS stack secrets'
  containers.podman.podman_secret:
    name: '{{ item.name }}'
    data: '{{ item.data }}'
    skip_existing: true
    state: 'present'
  loop:
    - name: 'ttrss_postgres_user'
      data: '{{ ttrss.postgres.user }}'
      services:
        - 'ttrss-postgres.service'
        - 'ttrss-server.service'
        - 'ttrss-updater.service'
    - name: 'ttrss_postgres_password'
      data: '{{ ttrss.postgres.password }}'
      services:
        - 'ttrss-postgres.service'
        - 'ttrss-server.service'
        - 'ttrss-updater.service'
  loop_control:
    label: '{{ item.name }}'
  register: 'podman_secrets'

- name: 'Create Server environment file'
  ansible.builtin.copy:
    content: '{{ item.content }}'
    dest: '{{ containers_storage_path }}/env/{{ item.dest }}'
    owner: 'root'
    group: 'root'
    mode: '0400'
  loop:
    - content: |
        TTRSS_DB_USER={{ ttrss.postgres.user }}
        TTRSS_DB_PASS={{ ttrss.postgres.password }}
      dest: 'ttrss-server/ttrss-server.env'
      services:
        - 'ttrss-server.service'
        - 'ttrss-updater.service'
  loop_control:
    label: '{{ item.dest }}'
  register: 'environment_files'

- name: 'Create Tiny Tiny RSS stack quadlet units from templates'
  ansible.builtin.template:
    src: '{{ item }}.container.j2'
    dest: '/etc/containers/systemd/{{ item }}.container'
    owner: 'root'
    group: 'root'
    mode: '0644'
  loop:
    - 'ttrss-postgres'
    - 'ttrss-server'
    - 'ttrss-updater'
    - 'ttrss-nginx'
  register: 'quadlet_units'
  notify: 'Reload systemd daemon'

- name: 'Create PostgreSQL dump systemd service from template'
  ansible.builtin.template:
    src: 'ttrss-postgres-dump.service.j2'
    dest: '/etc/systemd/system/ttrss-postgres-dump.service'
    owner: 'root'
    group: 'root'
    mode: '0644'
  notify: 'Reload systemd daemon'

- name: 'Copy PostgreSQL dump systemd timer'
  ansible.builtin.copy:
    src: 'ttrss-postgres-dump.timer'
    dest: '/etc/systemd/system/ttrss-postgres-dump.timer'
    owner: 'root'
    group: 'root'
    mode: '0644'
  notify: 'Reload systemd daemon'

- name: 'Enable and start Tiny Tiny RSS stack'
  ansible.builtin.systemd_service:
    name: '{{ item }}'
    daemon_reload: true
    enabled: true
    state: 'started'
  register: 'systemd_start'
  loop:
    - 'ttrss-postgres.service'
    - 'ttrss-server.service'
    - 'ttrss-updater.service'
    - 'ttrss-nginx.service'
    - 'ttrss-postgres-dump.timer'

- name: 'Restart Tiny Tiny RSS services if podman secret, environment file or quadlet unit has changed while service was already started'
  ansible.builtin.systemd_service:
    name: '{{ item }}'
    daemon_reload: true
    state: 'restarted'
  vars:
    podman_secrets_map: '{{ podman_secrets.results | selectattr("changed", "true") | map(attribute="item.services") | select("defined") | ansible.builtin.flatten }}'
    environment_files_map: '{{ environment_files.results | selectattr("changed", "true") | map(attribute="item.services") | select("defined") | ansible.builtin.flatten }}'
    quadlet_units_map: '{{ quadlet_units.results | selectattr("changed", "true") | map(attribute="item") | ansible.builtin.product([".service"]) | map("join") }}'
    systemd_start_map: '{{ systemd_start.results | selectattr("changed", "true") | map(attribute="name") }}'
  loop: '{{ (podman_secrets_map + environment_files_map + quadlet_units_map) | unique | difference(systemd_start_map) }}'
