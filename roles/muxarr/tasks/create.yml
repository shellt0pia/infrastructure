---
- name: 'Create Muxarr data bind mount path'
  ansible.builtin.file:
    path: '{{ containers_storage_path }}/data/muxarr'
    owner: 888
    group: 888
    mode: '0700'
    state: 'directory'

- name: 'Create Muxarr quadlet unit from template'
  ansible.builtin.template:
    src: 'muxarr.container.j2'
    dest: '/etc/containers/systemd/muxarr.container'
    owner: 'root'
    group: 'root'
    mode: '0644'
  register: 'quadlet_unit'
  notify: 'Reload systemd daemon'

- name: 'Enable and start Muxarr container'
  ansible.builtin.systemd_service:
    name: 'muxarr.service'
    daemon_reload: true
    enabled: true
    state: 'started'
  register: 'systemd_start'

- name: 'Restart Muxarr service if quadlet unit has changed while service was already started'
  ansible.builtin.systemd_service:
    name: 'muxarr.service'
    daemon_reload: true
    state: 'restarted'
  when: (quadlet_unit.changed and not systemd_start.changed)
