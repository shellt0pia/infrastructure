---
- name: 'Pull resticprofile image'
  containers.podman.podman_image:
    name: '{{ containers_images.resticprofile }}:{{ containers_images_tags.resticprofile }}'
    pull: true
    force: true
    state: 'present'
  register: 'container_image_pull'
  tags: ['never', 'containers-pull', 'containers-update']

- name: 'Update resticprofile tag in systemd unit and script' # noqa: no-handler
  ansible.builtin.template:
    src: '{{ item.src }}'
    dest: '{{ item.dest }}'
    owner: 'root'
    group: 'root'
    mode: '{{ item.mode }}'
  loop:
    - src: 'resticprofile@.service.j2'
      dest: '/etc/systemd/system/resticprofile@.service'
      mode: '0644'
    - src: 'resticprofile.j2'
      dest: '/usr/local/bin/resticprofile'
      mode: '0755'
  when: (container_image_pull.changed)
  notify: 'Reload systemd daemon'
  tags: ['never', 'containers-update']

- name: 'Disable resticprofile timers'
  ansible.builtin.systemd_service:
    name: '{{ item }}'
    enabled: false
  loop:
    - 'resticprofile@backup.timer'
    - 'resticprofile@check.timer'
  tags: ['never', 'containers-disable']

- name: 'Stop resticprofile timers'
  ansible.builtin.systemd_service:
    name: '{{ item }}'
    state: 'stopped'
  loop:
    - 'resticprofile@backup.timer'
    - 'resticprofile@check.timer'
  tags: ['never', 'containers-stop']

- name: 'Enable resticprofile timers'
  ansible.builtin.systemd_service:
    name: '{{ item }}'
    enabled: true
  loop:
    - 'resticprofile@backup.timer'
    - 'resticprofile@check.timer'
  tags: ['never', 'containers-enable']

- name: 'Start resticprofile timers'
  ansible.builtin.systemd_service:
    name: '{{ item }}'
    state: 'started'
  loop:
    - 'resticprofile@backup.timer'
    - 'resticprofile@check.timer'
  tags: ['never', 'containers-start']
