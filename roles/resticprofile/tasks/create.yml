---
- name: 'Create resticprofile bind mounts paths'
  ansible.builtin.file:
    path: '{{ containers_storage_path }}/{{ item }}'
    owner: 'root'
    group: 'root'
    mode: '0700'
    state: 'directory'
  loop:
    - 'config/resticprofile'
    - 'runtime/resticprofile/cache'
    - 'runtime/resticprofile/restore'

- name: 'Create resticprofile config from template'
  ansible.builtin.template:
    src: 'profiles.yaml.j2'
    dest: '{{ containers_storage_path }}/config/resticprofile/profiles.yaml'
    owner: 'root'
    group: 'root'
    mode: '0644'

- name: 'Create resticprofile repository password secret'
  containers.podman.podman_secret:
    name: 'resticprofile_repository_password'
    data: '{{ resticprofile.password }}'
    skip_existing: true
    state: 'present'

- name: 'Create resticprofile repository backend credentials secrets'
  containers.podman.podman_secret:
    name: 'resticprofile_{{ item.key | lower }}'
    data: '{{ item.value }}'
    skip_existing: true
    state: 'present'
  loop: '{{ resticprofile.environment | default({}) | dict2items }}'
  loop_control:
    label: '{{ item.key }}'

- name: 'Create resticprofile systemd service from template'
  ansible.builtin.template:
    src: 'resticprofile@.service.j2'
    dest: '/etc/systemd/system/resticprofile@.service'
    owner: 'root'
    group: 'root'
    mode: '0644'
  notify: 'Reload systemd daemon'

- name: 'Copy resticprofile systemd timers'
  ansible.builtin.copy:
    src: '{{ item }}'
    dest: '/etc/systemd/system/{{ item }}'
    owner: 'root'
    group: 'root'
    mode: '0644'
  loop:
    - 'resticprofile@backup.timer'
    - 'resticprofile@check.timer'
  notify: 'Reload systemd daemon'

- name: 'Add resticprofile script to /usr/local/bin'
  ansible.builtin.template:
    src: 'resticprofile.j2'
    dest: '/usr/local/bin/resticprofile'
    owner: 'root'
    group: 'root'
    mode: '0755'

- name: 'Enable and start resticprofile timers'
  ansible.builtin.systemd_service:
    name: '{{ item }}'
    daemon_reload: true
    enabled: true
    state: 'started'
  loop:
    - 'resticprofile@backup.timer'
    - 'resticprofile@check.timer'
