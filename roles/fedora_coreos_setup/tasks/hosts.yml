---
# The hosts /etc/hostname contains their FQDN, so systemd-resolved considers it as the local hostname and synthesizes the answer
# for it with all the locally configured addresses (including every podman bridge ULA and link-local addresses) instead of
# querying the upstream DNS servers. This made some containers unable to resolve/reach the FQDN of the host they run on.
# Hostname synthesis can't be disabled in resolved.conf, only with the (documented but not in the man pages) environment variable
# below. See https://github.com/systemd/systemd/blob/main/docs/ENVIRONMENT.md
# The FQDN is then resolved by the upstream DNS servers like any other name, no need to hardcode the hosts IPs in /etc/hosts.
- name: 'Create systemd-resolved systemd unit override directory'
  ansible.builtin.file:
    path: '/etc/systemd/system/systemd-resolved.service.d'
    owner: 'root'
    group: 'root'
    mode: '0755'
    state: 'directory'

- name: 'Copy systemd-resolved systemd unit override to disable local hostname synthesis'
  ansible.builtin.copy:
    src: 'systemd-resolved-service-d-hostname-synthesis.conf'
    dest: '/etc/systemd/system/systemd-resolved.service.d/hostname-synthesis.conf'
    owner: 'root'
    group: 'root'
    mode: '0644'
  notify: 'Restart systemd-resolved service'
