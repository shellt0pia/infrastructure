---
- name: 'Create autobrr data bind mount path'
  ansible.builtin.file:
    path: '{{ containers_storage_path }}/data/autobrr'
    owner: 1000
    group: 1000
    mode: '0700'
    state: 'directory'

- name: 'Create autobrr secret'
  containers.podman.podman_secret:
    name: 'autobrr_oidc_client_secret'
    data: '{{ autobrr.oidc.client_secret }}'
    skip_existing: true
    state: 'present'
  register: 'podman_secret'

- name: 'Create autobrr quadlet unit from template'
  ansible.builtin.template:
    src: 'autobrr.container.j2'
    dest: '/etc/containers/systemd/autobrr.container'
    owner: 'root'
    group: 'root'
    mode: '0644'
  register: 'quadlet_unit'
  notify: 'Reload systemd daemon'

- name: 'Enable and start autobrr container'
  ansible.builtin.systemd_service:
    name: 'autobrr.service'
    daemon_reload: true
    enabled: true
    state: 'started'
  register: 'systemd_start'

- name: 'Restart autobrr service if podman secret or quadlet unit has changed while service was already started'
  ansible.builtin.systemd_service:
    name: 'autobrr.service'
    daemon_reload: true
    state: 'restarted'
  when: ((podman_secret.changed or quadlet_unit.changed) and not systemd_start.changed)
