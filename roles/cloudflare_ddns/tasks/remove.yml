---
- name: 'Ensure the user really wants to remove the Cloudflare DDNS container'
  ansible.builtin.pause:
    prompt: "WARNING! DO YOU REALLY WANT TO REMOVE THE CLOUDFLARE DDNS CONTAINER?\nAnswer yes in capital letters to confirm"
    echo: true
  register: remove_prompt

- name: "Stop execution if user didn't answer 'YES'"
  ansible.builtin.fail:
    msg: "Stopping playbook execution because the playbook was called with the tag 'containers-remove' but the user didn't want to remove the containers."
  when: (remove_prompt.user_input != "YES")

- name: 'Disable and stop Cloudflare DDNS container'
  ansible.builtin.systemd_service:
    name: 'cloudflare-ddns.service'
    daemon_reload: true
    enabled: false
    state: 'stopped'
  register: systemd_unit
  failed_when: (systemd_unit.failed and not "Could not find the requested service" in systemd_unit.msg)

- name: 'Remove Cloudflare DDNS container quadlet unit'
  ansible.builtin.file:
    path: '/etc/containers/systemd/cloudflare-ddns.container'
    state: 'absent'
  notify: 'Reload systemd daemon'

- name: 'Remove Cloudflare DDNS secret'
  containers.podman.podman_secret:
    name: 'cloudflare_ddns_token'
    state: 'absent'

- name: 'Remove Cloudflare DDNS env bind mount path'
  ansible.builtin.file:
    path: '{{ containers_storage_path }}/env/cloudflare-ddns'
    state: 'absent'
