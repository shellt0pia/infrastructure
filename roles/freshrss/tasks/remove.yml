---
- name: 'Ensure the user really wants to remove the FreshRSS stack'
  ansible.builtin.pause:
    prompt: "WARNING! DO YOU REALLY WANT TO REMOVE THE FRESHRSS STACK?\nTHIS ACTION WILL DELETE ALL FRESHRSS APP DATA AND IS IRREVERSIBLE!\nAnswer yes in capital letters to confirm"
    echo: true
  register: remove_prompt

- name: "Stop execution if user didn't answer 'YES'"
  ansible.builtin.fail:
    msg: "Stopping playbook execution because the playbook was called with the tag 'containers-remove' but the user didn't want to remove the containers."
  when: (remove_prompt.user_input != "YES")

- name: 'Disable and stop FreshRSS container'
  ansible.builtin.systemd_service:
    name: 'freshrss.service'
    daemon_reload: true
    enabled: false
    state: 'stopped'
  register: systemd_unit
  failed_when: (systemd_unit.failed and not "Could not find the requested service" in systemd_unit.msg)

- name: 'Remove FreshRSS quadlet unit'
  ansible.builtin.file:
    path: '/etc/containers/systemd/freshrss.container'
    state: 'absent'
  notify: 'Reload systemd daemon'

- name: 'Remove FreshRSS data bind mount path'
  ansible.builtin.file:
    path: '{{ containers_storage_path }}/data/freshrss'
    state: 'absent'

- name: 'Remove FreshRSS CNAME record'
  community.general.cloudflare_dns:
    api_token: '{{ cloudflare_dns_token }}'
    zone: '{{ domain_name }}'
    record: 'freshrss'
    type: 'CNAME'
    value: '{{ ansible_facts["fqdn"] }}'
    state: 'absent'
  delegate_to: 'localhost'
